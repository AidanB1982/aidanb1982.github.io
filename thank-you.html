<!DOCTYPE html>
<html>
<head>
    <title>Thank You | Blackwood Publishing</title>

    <style>
        body {
            margin: 0;
            font-family: Georgia, serif;
            background-image: url('stone.png');
            background-size: cover;
            background-attachment: fixed;
            color: #2c2c2c;
        }

        /* HEADER */
        .header {
            position: relative;
            height: 40vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .header-overlay {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                rgba(22,22,25,0.85),
                rgba(22,22,25,0.85)
            ),
            url('forest.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .header-inner {
            position: relative;
            z-index: 1;
        }

        .header-logo {
            width: 140px;
            filter: invert(1);
            margin-bottom: 10px;
        }

        .header h1 {
            color: #F1F1F1;
            font-weight: normal;
            letter-spacing: 2px;
        }

        /* SECTION */
        .section {
            padding: 80px 20px;
            text-align: center;
            background-color: rgba(232, 228, 220, 0.55);
            margin: -40px auto 0;
            width: 90%;
            max-width: 700px;
        }

        .section p {
            max-width: 520px;
            margin: 20px auto;
            line-height: 1.7;
        }

        .button {
            margin-top: 20px;
            padding: 10px 22px;
            background: #5F7D76;
            color: #fff;
            text-decoration: none;
            display: inline-block;
            font-size: 14px;
        }

        .button:hover {
            background: #4e6a63;
        }

        /* FOOTER */
        .footer {
            position: relative;
            padding: 80px 20px;
            color: #F1F1F1;
        }

        .footer::before {
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                rgba(22,22,25,0.6),
                rgba(22,22,25,0.6)
            ),
            url('forest.png');
            background-size: cover;
            background-position: center;
        }

        .footer-content {
            position: relative;
            z-index: 1;
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        .footer-center img {
            width: 80px;
            filter: invert(1);
        }

        .footer a {
            color: #F1F1F1;
            margin-left: 15px;
            text-decoration: none;
        }

    </style>
</head>

<body>

<!-- HEADER -->
<div class="header">
    <div class="header-overlay"></div>

    <div class="header-inner">
        <img src="logo.png" class="header-logo">
        <h1>Thank You</h1>
    </div>
</div>

<!-- CONTENT -->
<div class="section">

    <p>
        Your message has been received.
    </p>

    <p>
        A response will follow in due course.
    </p>

    <p>
        In the meantime, you can return to the site or continue exploring.
    </p>

    <a href="index.html" class="button">Return Home</a>

</div>

<!-- FOOTER -->
<div class="footer">
    <div class="footer-content">

        <div>
            <p>Blackwood Publishing</p>
            <p>Independent Literary Imprint</p>
        </div>

        <div class="footer-center">
            <img src="seal.png">
        </div>

        <div>
            <a href="publications.html">Publications</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </div>

    </div>
</div>

</body>
</html>
