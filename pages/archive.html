<!DOCTYPE html>
<html lang="en-GB">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="The Blackwood Archive — permanent publication records and associated material from Blackwood Publishing."
    >

    <title>
        The Archive | Blackwood Publishing
    </title>

    <!-- Main Blackwood site styles -->
    <link
        rel="stylesheet"
        href="/css/header.css?v=20260815"
    >

    <link
        rel="stylesheet"
        href="/css/styles.css?v=20260815"
    >

    <!-- Archive room styles -->
    <link
        rel="stylesheet"
        href="/css/archive.css?v=20260917-5"
    >
</head>


<body class="archive-page">

    <!-- =========================
         BLACKWOOD ARCHIVE ROOM
         ========================= -->

    <main
        id="blackwood-archive-room"
        class="archive-room"
    >

        <!-- =========================
             ROOM BACKGROUND
             ========================= -->

        <div
            class="archive-room-background"
            aria-hidden="true"
        ></div>


        <!-- =========================
             ATMOSPHERIC LIGHTING
             ========================= -->

        <div
            class="archive-room-moonlight"
            aria-hidden="true"
        ></div>

        <div
            class="archive-room-lamplight"
            aria-hidden="true"
        ></div>

        <div
            class="archive-room-vignette"
            aria-hidden="true"
        ></div>


        <!-- =========================
             HOME
             ========================= -->

        <a
            class="archive-home-link"
            href="/"
            aria-label="Return to Blackwood Publishing home"
            title="Return to Blackwood Publishing"
        >
            <span aria-hidden="true">
                &#8962;
            </span>
        </a>


        <!-- =========================
             CORKBOARD
             Future Archive newsboard
             ========================= -->

        <aside
            class="archive-newsboard"
            aria-label="Blackwood Archive newsboard"
        >

            <div
                class="archive-newsboard-frame"
                aria-hidden="true"
            >

                <div class="archive-newsboard-surface">

                    <div class="archive-newsboard-pin archive-newsboard-pin-left"></div>

                    <div class="archive-newsboard-pin archive-newsboard-pin-right"></div>

                    <div class="archive-newsboard-paper">

                        <span class="archive-newsboard-stamp">
                            Blackwood Archive
                        </span>

                        <strong>
                            Filed Notices
                        </strong>

                        <small>
                            Further material pending.
                        </small>

                    </div>

                </div>

            </div>

        </aside>


        <!-- =========================
             DESK SCENE
             ========================= -->

        <section
            class="archive-desk-scene"
            aria-label="Blackwood Archive desk"
        >

            <!-- =========================
                 DESK
                 ========================= -->

            <div
                class="archive-desk"
                aria-hidden="true"
            >

                <div class="archive-desk-surface"></div>

                <div class="archive-desk-edge"></div>

                <div class="archive-desk-front"></div>

            </div>


            <!-- =========================
                 ARCHIVE CABINET POSITION
                 ========================= -->

            <div class="archive-cabinet-position">

                <div
                    class="archive-cabinet-plaque"
                    aria-hidden="true"
                >
                    <span>
                        Blackwood Archive
                    </span>

                    <small>
                        Publication Files
                    </small>
                </div>


                <!-- =========================
                     ARCHIVE APPLICATION

                     archive.js will continue
                     rendering publication data
                     into this element.
                     ========================= -->

                <section
                    id="blackwood-archive-app"
                    class="archive-app"
                    aria-live="polite"
                >

                    <section class="archive-loading">

                        <span
                            class="archive-loading-mark"
                            aria-hidden="true"
                        ></span>

                        <p>
                            Opening the files...
                        </p>

                    </section>

                </section>

            </div>


            <!-- =========================
                 DESK LAMP
                 ========================= -->

            <div class="archive-lamp-position">

                <button
                    id="archive-lamp-toggle"
                    class="archive-lamp"
                    type="button"
                    aria-label="Turn archive lamp off"
                    aria-pressed="true"
                    title="Switch off the lamp"
                >

                    <span
                        class="archive-lamp-shade"
                        aria-hidden="true"
                    ></span>

                    <span
                        class="archive-lamp-bulb"
                        aria-hidden="true"
                    ></span>

                    <span
                        class="archive-lamp-arm archive-lamp-arm-upper"
                        aria-hidden="true"
                    ></span>

                    <span
                        class="archive-lamp-joint"
                        aria-hidden="true"
                    ></span>

                    <span
                        class="archive-lamp-arm archive-lamp-arm-lower"
                        aria-hidden="true"
                    ></span>

                    <span
                        class="archive-lamp-base"
                        aria-hidden="true"
                    ></span>

                    <span
                        class="archive-lamp-switch"
                        aria-hidden="true"
                    ></span>

                </button>

            </div>

        </section>


        <!-- =========================
             DARK-ROOM MESSAGE

             Hidden while the lamp is on.
             We'll replace this with an
             actual chosen book phrase.
             ========================= -->

        <div
            class="archive-dark-message"
            aria-hidden="true"
        >
            <span>
                Something was written here.
            </span>
        </div>


        <!-- =========================
             MOBILE ATMOSPHERE
             ========================= -->

        <div
            class="archive-room-grain"
            aria-hidden="true"
        ></div>

    </main>


    <!-- =========================
         ARCHIVE JAVASCRIPT
         ========================= -->

    <script
        src="/js/archive.js?v=20260917-3"
        defer
    ></script>

</body>

</html>
