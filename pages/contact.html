<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contact | Blackwood Publishing</title>

<meta name="description" content="Blackwood Publishing is an independent imprint publishing literary and psychological fiction shaped by place, memory, and atmosphere.">

<link rel="stylesheet" href="/css/header.css">
<link rel="stylesheet" href="/css/styles.css">

</head>

<body class="sub-page contact-page">

<!-- HEADER -->
<div id="header-placeholder"></div>

<!-- HERO -->
<section class="about-hero">

    <div class="about-hero-overlay"></div>

    <div class="about-hero-content fade-in">
        <p class="about-intro-line">Correspondence</p>
        <h1>Contact</h1>
    </div>

</section>

<!-- CONTENT -->
<section class="about-section fade-in">

    <p>
        For enquiries, collaborations, or general correspondence, use the form below.
    </p>

    <div class="divider"></div>

    <!-- FORM -->
    <form 
        action="https://formspree.io/f/mbdpplkw" 
        method="POST" 
        class="contact-form"
    >

        <label for="name" class="sr-only">Name</label>
        <input 
            id="name"
            type="text" 
            name="name" 
            placeholder="Name" 
            required
            autocomplete="name"
        >

        <label for="email" class="sr-only">Email</label>
        <input 
            id="email"
            type="email" 
            name="email" 
            placeholder="Email" 
            required
            autocomplete="email"
        >

        <label for="message" class="sr-only">Message</label>
        <textarea 
            id="message"
            name="message" 
            placeholder="Message" 
            required
            rows="5"
        ></textarea>

        <!-- OPTIONAL REDIRECT (replace with real URL or remove) -->
        <!--
        <input 
            type="hidden" 
            name="_redirect" 
            value="https://yourdomain.com/thank-you.html"
        >
        -->

        <button type="submit" class="button copper">
            Send Message
        </button>

    </form>

</section>

<!-- FOOTER -->
<div style="height:40px;"></div>
<div id="footer-placeholder"></div>

<!-- JS -->
<script src="/js/header.js?v=20260408" defer></script>

<script>
window.addEventListener("load", async () => {

    if (typeof loadHeader !== "function") {
        console.error("Header failed to load");
        return;
    }

    await loadHeader("simple");

    if (typeof initFadeIn === "function") initFadeIn();

});
</script>

</body>
</html>
