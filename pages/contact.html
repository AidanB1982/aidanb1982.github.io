<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contact | Blackwood Publishing</title>

<meta name="description" content="Blackwood Publishing is an independent imprint publishing literary and psychological fiction shaped by place, memory, and atmosphere.">

<link rel="stylesheet" href="/css/header.css">
<link rel="stylesheet" href="/css/styles.css">

</head>

<body>

<!-- HEADER -->
<div id="header-placeholder"></div>

<!-- HERO -->
<section class="about-hero">

    <div class="about-hero-overlay"></div>

    <div class="about-hero-content fade-in">
        <p class="about-intro-line">Correspondence</p>
        <h1>Contact</h1>
    </div>

</section>

<!-- CONTENT -->
<section class="about-section fade-in">

    <p>
        For enquiries, collaborations, or general correspondence, use the form below.
    </p>

    <div class="divider"></div>

    <!-- FORM -->
    <form 
        action="https://formspree.io/f/mbdpplkw" 
        method="POST" 
        style="
            max-width:520px;
            margin:30px auto 0;
            display:flex;
            flex-direction:column;
            gap:25px;
        "
    >

        <input 
            type="text" 
            name="name" 
            placeholder="Name" 
            required
            style="
                border:none;
                border-bottom:1px solid rgba(255,255,255,0.2);
                background:transparent;
                padding:10px 0;
                color:#e6e6e6;
                font-family:Georgia, serif;
            "
        >

        <input 
            type="email" 
            name="email" 
            placeholder="Email" 
            required
            style="
                border:none;
                border-bottom:1px solid rgba(255,255,255,0.2);
                background:transparent;
                padding:10px 0;
                color:#e6e6e6;
                font-family:Georgia, serif;
            "
        >

        <textarea 
            name="message" 
            placeholder="Message" 
            required
            style="
                border:none;
                border-bottom:1px solid rgba(255,255,255,0.2);
                background:transparent;
                padding:10px 0;
                color:#e6e6e6;
                min-height:120px;
                font-family:Georgia, serif;
                resize:vertical;
            "
        ></textarea>

        <input 
            type="hidden" 
            name="_redirect" 
            value="https://yourdomain.com/thank-you.html"
        >

        <button 
            type="submit"
            class="button copper"
            style="margin-top:10px;"
        >
            Send Message
        </button>

    </form>

</section>

<!-- FOOTER -->
<div style="height:40px;"></div>
<div id="footer-placeholder"></div>

<script src="/js/header.js" defer></script>

<script>
window.addEventListener("load", () => {
    if (typeof loadHeader === "function") {
        loadHeader("simple");
    } else {
        console.error("Header failed to load");
    }

    // SAFE fade-in call
    if (typeof initFadeIn === "function") {
        initFadeIn();
    }
});
</script>

</body>
</html>
