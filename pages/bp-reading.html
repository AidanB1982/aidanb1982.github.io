
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >
  <meta name="theme-color" content="#171310">

  <title>BP Reading | Blackwood Publishing</title>

  <style>
    html:not(.bp-admin-verified) body {
      visibility: hidden;
    }

    :root {
      color-scheme: dark;
      --bg: #171310;
      --panel: #241c17;
      --copper: #c99b6b;
      --border: #49372b;
      --text: #f0e5d7;
      --muted: #b7a594;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
    }

    button,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:focus-visible,
    select:focus-visible {
      outline: 2px solid var(--copper);
      outline-offset: 3px;
    }

    [hidden] {
      display: none !important;
    }

    /* LIBRARY */

    .library {
      max-width: 1120px;
      margin: auto;
      padding: 2rem 1.25rem 5rem;
    }

    .library-header {
      border-bottom: 1px solid var(--border);
      padding-bottom: 2rem;
      margin-bottom: 2.5rem;
    }

    .brand {
      color: var(--copper);
      letter-spacing: .2em;
      font-size: 1.1rem;
    }

    .brand-subtitle {
      color: var(--muted);
      font: .7rem Arial, sans-serif;
      letter-spacing: .28em;
      margin-top: .4rem;
    }

    .library h1 {
      margin: 2.5rem 0 .6rem;
      font-weight: normal;
      font-size: clamp(2rem, 5vw, 3rem);
    }

    .library-intro {
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.7;
    }

    .book-grid {
      display: grid;
      grid-template-columns:
        repeat(auto-fill, minmax(220px, 1fr));
      gap: 2rem;
    }

    .book-card {
      border: 1px solid var(--border);
      border-radius: .8rem;
      background: var(--panel);
      overflow: hidden;
      padding: 1rem;
    }

    .book-cover {
      width: 100%;
      aspect-ratio: 2 / 3;
      border: 1px solid #806044;
      border-radius: .4rem;
      background: #100e0c;
      overflow: hidden;
    }

    .book-cover img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .book-card h2 {
      font-size: 1.2rem;
      font-weight: normal;
      margin: 1.2rem 0 .35rem;
    }

    .book-description {
      color: var(--muted);
      font: .85rem Arial, sans-serif;
      line-height: 1.5;
      min-height: 2.5rem;
    }

    .progress-label {
      color: var(--muted);
      font: .75rem Arial, sans-serif;
      margin: 1rem 0 .5rem;
    }

    .progress-track {
      height: 5px;
      background: #49372b;
      border-radius: 10px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0;
      background: var(--copper);
      transition: width .2s;
    }

    .open-book {
      width: 100%;
      margin-top: 1.25rem;
      padding: .8rem;
      border: 1px solid var(--copper);
      border-radius: .5rem;
      background: #382719;
      color: #f5dfc7;
    }

    .open-book:hover:not(:disabled) {
      background: #4c3523;
    }

    .open-book:disabled {
      opacity: .65;
      cursor: wait;
    }

    .library-note {
      margin-top: 2.5rem;
      color: var(--muted);
      font: .8rem Arial, sans-serif;
      line-height: 1.6;
    }

    .library-error {
      margin-top: 1rem;
      color: #e8b9a3;
      font: .85rem Arial, sans-serif;
      line-height: 1.6;
    }

    /* IMMERSIVE READER */

    .reader {
      position: fixed;
      inset: 0;
      z-index: 10;
      overflow: hidden;
      background: #eee0c5;
      color: #30271f;
    }

    .reader[data-theme="day"] {
      background: #fffdf7;
      color: #242424;
    }

    .reader[data-theme="night"] {
      background: #201c1a;
      color: #e9dfd2;
    }

    .reading-surface {
      height: 100%;
      height: 100dvh;
      padding:
        clamp(1.5rem, 5vh, 3rem)
        1.5rem;
    }

    .reading-column {
      max-width: 760px;
      height: 100%;
      margin: auto;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .reader-book-title {
      text-align: center;
      font: .72rem Arial, sans-serif;
      letter-spacing: .2em;
      opacity: .65;
      margin-bottom: 1.25rem;
      flex: 0 0 auto;
    }

    .epub-viewer {
      flex: 1 1 auto;
      min-height: 0;
      width: 100%;
      overflow: hidden;
    }

    .epub-viewer iframe {
      border: 0;
    }

    .reader-loading {
      margin: auto;
      text-align: center;
      font: 1rem Arial, sans-serif;
      line-height: 1.7;
      opacity: .75;
    }

    /* SIDE PAGE ARROWS */

    .reader-page-arrows {
      position: fixed;
      inset: 0;
      z-index: 15;
      pointer-events: none;
    }

    .reader-page-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);

      width: 46px;
      height: 76px;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 0;
      border: 0;
      border-radius: .5rem;

      background: transparent;
      color: #8a6d50;

      font: 2rem Arial, sans-serif;
      opacity: .38;

      pointer-events: auto;
      touch-action: manipulation;

      transition:
        opacity .2s,
        background .2s;
    }

    .reader-page-arrow-left {
      left: max(4px, env(safe-area-inset-left));
    }

    .reader-page-arrow-right {
      right: max(4px, env(safe-area-inset-right));
    }

    .reader-page-arrow:hover,
    .reader-page-arrow:focus-visible {
      opacity: 1;
      background: #7c61451c;
    }

    .reader-page-arrow:disabled {
      opacity: .12;
      cursor: not-allowed;
    }

    .reader[data-theme="night"] .reader-page-arrow {
      color: #d4b18a;
    }

    .reader[data-theme="day"] .reader-page-arrow {
      color: #796755;
    }

    /* ALWAYS-ACCESSIBLE MENU */

    .reader-menu-toggle {
      position: fixed;
      top: max(10px, env(safe-area-inset-top));
      right: max(10px, env(safe-area-inset-right));
      z-index: 25;

      padding: .65rem .85rem;
      border: 1px solid #806044;
      border-radius: .45rem;

      background: #241c17ed;
      color: #f0e5d7;

      font: .8rem Arial, sans-serif;
      box-shadow: 0 2px 10px #0002;
    }

    /* READER CONTROLS */

    .reader-controls {
      position: fixed;
      inset: 0 0 auto;
      z-index: 20;

      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;

      padding:
        max(1rem, env(safe-area-inset-top))
        5.5rem
        1rem
        max(1rem, env(safe-area-inset-left));

      background: #1b1513f2;
      color: #f0e5d7;
      border-bottom: 1px solid #58402e;
      font: .85rem Arial, sans-serif;
    }

    .reader-bottom {
      position: fixed;
      inset: auto 0 0;
      z-index: 20;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;

      padding:
        1rem
        max(1rem, env(safe-area-inset-right))
        max(1rem, env(safe-area-inset-bottom))
        max(1rem, env(safe-area-inset-left));

      background: #1b1513f2;
      color: #f0e5d7;
      border-top: 1px solid #58402e;
      font: .85rem Arial, sans-serif;
    }

    .control-group {
      display: flex;
      flex-wrap: wrap;
      gap: .5rem;
      align-items: center;
    }

    .control {
      padding: .65rem .8rem;
      border: 1px solid #604631;
      border-radius: .4rem;
      background: #30241c;
      color: #f0e5d7;
    }

    .control:disabled {
      opacity: .35;
      cursor: not-allowed;
    }

    .reader-progress {
      color: #cbb7a3;
      text-align: center;
      font-size: .8rem;
    }

    .reader-status {
      position: fixed;
      bottom: 5.5rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;

      padding: .5rem .8rem;
      background: #1b1513e8;
      color: #f1cfaa;
      border-radius: .4rem;
      font: .75rem Arial, sans-serif;

      pointer-events: none;
      max-width: calc(100% - 2rem);
      text-align: center;
    }

    .reader-status:empty {
      display: none;
    }

    /* MOBILE */

    @media (max-width: 850px) {
      .reading-surface {
        padding:
          max(1.5rem, env(safe-area-inset-top))
          3.1rem
          max(1.5rem, env(safe-area-inset-bottom));
      }

      .reader-page-arrow {
        width: 42px;
        height: 76px;
        opacity: .55;
      }

      .reader-book-title {
        margin-bottom: .75rem;
      }
    }

    @media (max-width: 650px) {
      .reading-surface {
        padding:
          max(1.2rem, env(safe-area-inset-top))
          2.75rem
          max(1rem, env(safe-area-inset-bottom));
      }

      .reader-page-arrow {
        width: 40px;
        height: 88px;
        font-size: 1.65rem;
        opacity: .65;
      }

      .reader-controls {
        justify-content: center;
        padding:
          calc(max(1rem, env(safe-area-inset-top)) + 2.6rem)
          .65rem
          .65rem;
        gap: .5rem;
      }

      .control-group {
        justify-content: center;
      }

      .control {
        padding: .55rem .65rem;
        font-size: .8rem;
      }

      .reader-bottom {
        gap: .5rem;
      }

      .reader-progress {
        font-size: .72rem;
      }

      .reader-menu-toggle {
        padding: .6rem .75rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .reader-page-arrow,
      .progress-fill {
        transition: none;
      }
    }
  </style>
</head>

<body>

  <!-- LIBRARY -->

  <main class="library" id="library">

    <header class="library-header">
      <div class="brand">BLACKWOOD</div>
      <div class="brand-subtitle">BP READING</div>

      <h1>My Library</h1>

      <p class="library-intro">
        Your books. Your stories. Your place to
        disappear for a while.
      </p>
    </header>

    <section
      class="book-grid"
      id="book-grid"
      aria-label="Books in your library">
    </section>

    <p
      class="library-error"
      id="library-error"
      role="alert"
      hidden>
    </p>

    <p class="library-note">
      Administrator testing edition.
      Gualachulain is currently the only book
      connected to BP Reading.
    </p>

  </main>

  <!-- READER -->

  <section
    class="reader"
    id="reader"
    data-theme="parchment"
    aria-label="Immersive book reader"
    hidden>

    <div class="reading-surface" id="reading-surface">
      <article class="reading-column">

        <div
          class="reader-book-title"
          id="reader-book-title">
          GUALACHULAIN
        </div>

        <div
          class="reader-loading"
          id="reader-loading"
          role="status">
          Preparing your book…
        </div>

        <div
          class="epub-viewer"
          id="epub-viewer"
          aria-label="Gualachulain book pages"
          hidden>
        </div>

      </article>
    </div>

    <!-- PAGE TURNING ARROWS -->

    <nav
      class="reader-page-arrows"
      id="reader-page-arrows"
      aria-label="Turn book pages"
      hidden>

      <button
        class="reader-page-arrow reader-page-arrow-left"
        id="page-arrow-left"
        type="button"
        aria-label="Previous page">
        &#10094;
      </button>

      <button
        class="reader-page-arrow reader-page-arrow-right"
        id="page-arrow-right"
        type="button"
        aria-label="Next page">
        &#10095;
      </button>

    </nav>

    <!-- MENU BUTTON -->

    <button
      class="reader-menu-toggle"
      id="reader-menu-toggle"
      type="button"
      aria-controls="reader-controls"
      aria-expanded="false"
      hidden>
      ☰ Menu
    </button>

    <!-- TOP CONTROLS -->

    <header
      class="reader-controls"
      id="reader-controls"
      hidden>

      <button
        class="control"
        id="back-to-library"
        type="button">
        ← Library
      </button>

      <div class="control-group">

        <button
          class="control"
          id="font-smaller"
          type="button"
          aria-label="Decrease text size">
          A−
        </button>

        <button
          class="control"
          id="font-larger"
          type="button"
          aria-label="Increase text size">
          A+
        </button>

        <select
          class="control"
          id="reading-theme"
          aria-label="Reading theme">

          <option value="parchment">
            Parchment
          </option>

          <option value="day">
            Day
          </option>

          <option value="night">
            Night
          </option>

        </select>

        <button
          class="control"
          id="bookmark"
          type="button"
          aria-pressed="false">
          ☆ Bookmark
        </button>

      </div>
    </header>

    <!-- BOTTOM CONTROLS -->

    <nav
      class="reader-bottom"
      id="reader-bottom"
      aria-label="Reading navigation"
      hidden>

      <button
        class="control"
        id="previous"
        type="button">
        ← Previous
      </button>

      <span
        class="reader-progress"
        id="reader-progress">
        Preparing…
      </span>

      <button
        class="control"
        id="next"
        type="button">
        Next →
      </button>

    </nav>

    <div
      class="reader-status"
      id="reader-status"
      role="status"
      aria-live="polite">
    </div>

  </section>

  <!-- EPUB DEPENDENCIES -->

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"></script>

  <script type="module">
    "use strict";

    import {
      createClient
    } from "https://esm.sh/@supabase/supabase-js@2";

    const SUPABASE_URL =
      "https://bmnlynjldlnxfvunqbqq.supabase.co";

    const SUPABASE_ANON_KEY =
      "sb_publishable_eL7qdDe_6XWGhzmdsql_7w_7dg6psC0";

    const EDITION_ID = 2;

    const BOOK = {
      id: "BLACKWOOD-BOOK-001-EPUB",
      title: "Gualachulain",
      description:
        "Blackwood Publishing — administrator reading edition."
    };

    const STORAGE_KEY =
      "bp-reading-gualachulain-v1";

    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    const $ = id => document.getElementById(id);

    const allowedThemes = [
      "parchment",
      "day",
      "night"
    ];

    function loadSavedState() {
      try {
        const value = JSON.parse(
          localStorage.getItem(STORAGE_KEY)
        );

        return value &&
          typeof value === "object"
          ? value
          : {};
      } catch {
        return {};
      }
    }

    const saved = loadSavedState();

    const state = {
      theme: allowedThemes.includes(saved.theme)
        ? saved.theme
        : "parchment",

      fontSize:
        Number.isFinite(saved.fontSize)
          ? Math.max(
              15,
              Math.min(30, saved.fontSize)
            )
          : 19,

      position:
        typeof saved.position === "string" &&
        saved.position.startsWith("epubcfi(")
          ? saved.position
          : null,

      progress:
        Number.isFinite(saved.progress)
          ? Math.max(
              0,
              Math.min(100, saved.progress)
            )
          : 0,

      bookmarks:
        Array.isArray(saved.bookmarks)
          ? saved.bookmarks.filter(
              value =>
                typeof value === "string" &&
                value.startsWith("epubcfi(")
            )
          : [],

      hasStarted: saved.hasStarted === true,

      isOpen: false,
      isLoading: false,
      isNavigating: false,

      book: null,
      rendition: null,
      currentCfi: null,
      currentLocation: null,
      locationsReady: false,
      openingId: 0
    };

    function saveState() {
      try {
        localStorage.setItem(
          STORAGE_KEY,
          JSON.stringify({
            theme: state.theme,
            fontSize: state.fontSize,
            position: state.position,
            progress: state.progress,
            bookmarks: state.bookmarks,
            hasStarted: state.hasStarted
          })
        );
      } catch {
        showStatus(
          "Unable to save reading progress on this device."
        );
      }
    }

    function showStatus(message) {
      $("reader-status").textContent = message;
    }

    function setControlsVisible(visible) {
      $("reader-controls").hidden = !visible;
      $("reader-bottom").hidden = !visible;

      $("reader-menu-toggle").setAttribute(
        "aria-expanded",
        String(visible)
      );
    }

    function showLibraryError(message) {
      const element = $("library-error");
      element.textContent = message;
      element.hidden = !message;
    }

    function renderLibrary() {
      const grid = $("book-grid");
      grid.replaceChildren();

      const card = document.createElement("article");
      card.className = "book-card";

      const cover = document.createElement("div");
      cover.className = "book-cover";

      const coverImage = document.createElement("img");
      coverImage.src = "/assets/book7.png";
      coverImage.alt = "Gualachulain book cover";
      coverImage.loading = "lazy";

      cover.appendChild(coverImage);

      const heading = document.createElement("h2");
      heading.textContent = BOOK.title;

      const description = document.createElement("p");
      description.className = "book-description";
      description.textContent = BOOK.description;

      const progressLabel = document.createElement("p");
      progressLabel.className = "progress-label";

      progressLabel.textContent = state.hasStarted
        ? `${state.progress}% complete`
        : "Not started";

      const track = document.createElement("div");
      track.className = "progress-track";

      const fill = document.createElement("div");
      fill.className = "progress-fill";
      fill.style.width = `${state.progress}%`;

      track.appendChild(fill);

      const button = document.createElement("button");
      button.type = "button";
      button.className = "open-book";

      button.textContent = state.isLoading
        ? "Opening…"
        : state.hasStarted
          ? "Continue Reading"
          : "Read Book";

      button.disabled = state.isLoading;

      button.addEventListener(
        "click",
        openBook
      );

      card.append(
        cover,
        heading,
        description,
        progressLabel,
        track,
        button
      );

      grid.appendChild(card);
    }

    /* ADMIN AUTHENTICATION */

    async function verifyBPReadingAdmin() {
      const {
        data: { user },
        error: authError
      } = await supabase.auth.getUser();

      if (authError || !user) {
        throw new Error(
          "Authentication required"
        );
      }

      const {
        data: profile,
        error: profileError
      } = await supabase
        .from("member_profiles")
        .select("is_admin")
        .eq("id", user.id)
        .single();

      if (
        profileError ||
        profile?.is_admin !== true
      ) {
        throw new Error(
          "Administrator access required"
        );
      }

      return user;
    }

    /* PROTECTED EPUB DELIVERY */

    async function fetchProtectedEpub() {
      const {
        data: { session },
        error: sessionError
      } = await supabase.auth.getSession();

      if (
        sessionError ||
        !session?.access_token
      ) {
        throw new Error(
          "Your session has expired. Please sign in again."
        );
      }

      const response = await fetch(
        `${SUPABASE_URL}/functions/v1/bp-reading-deliver-epub`,
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json",
            "Authorization":
              `Bearer ${session.access_token}`,
            "apikey": SUPABASE_ANON_KEY
          },

          body: JSON.stringify({
            editionId: EDITION_ID
          }),

          cache: "no-store"
        }
      );

      if (!response.ok) {
        let message =
          "The reading edition could not be loaded.";

        try {
          const payload = await response.json();

          if (
            typeof payload.error === "string"
          ) {
            message = payload.error;
          }
        } catch {
          // Keep the generic error message.
        }

        throw new Error(message);
      }

      const contentType =
        response.headers.get("Content-Type") || "";

      if (
        !contentType.includes("application/epub+zip")
      ) {
        throw new Error(
          "The server returned an unexpected file type."
        );
      }

      const bytes = await response.arrayBuffer();

      const signature = new Uint8Array(
        bytes,
        0,
        Math.min(4, bytes.byteLength)
      );

      const validZip =
        signature.length === 4 &&
        signature[0] === 0x50 &&
        signature[1] === 0x4b &&
        signature[2] === 0x03 &&
        signature[3] === 0x04;

      if (!validZip) {
        throw new Error(
          "The returned file is not a valid EPUB archive."
        );
      }

      return bytes;
    }

    /* READING THEMES */

    function registerThemes(rendition) {
      rendition.themes.register(
        "parchment",
        {
          body: {
            background: "#eee0c5 !important",
            color: "#30271f !important",
            "font-family":
              "Georgia, 'Times New Roman', serif !important",
            "line-height": "1.85 !important"
          }
        }
      );

      rendition.themes.register(
        "day",
        {
          body: {
            background: "#fffdf7 !important",
            color: "#242424 !important",
            "font-family":
              "Georgia, 'Times New Roman', serif !important",
            "line-height": "1.85 !important"
          }
        }
      );

      rendition.themes.register(
        "night",
        {
          body: {
            background: "#201c1a !important",
            color: "#e9dfd2 !important",
            "font-family":
              "Georgia, 'Times New Roman', serif !important",
            "line-height": "1.85 !important"
          }
        }
      );
    }

    function applyReaderPreferences() {
      $("reader").dataset.theme = state.theme;
      $("reading-theme").value = state.theme;

      if (!state.rendition) {
        return;
      }

      state.rendition.themes.select(
        state.theme
      );

      state.rendition.themes.fontSize(
        `${Math.round(
          state.fontSize / 19 * 100
        )}%`
      );
    }

    /* BOOKMARKS */

    function getCurrentCfi() {
      const location = state.currentLocation;

      return location?.start?.cfi ||
        state.currentCfi ||
        null;
    }

    function updateBookmarkButton() {
      const current = getCurrentCfi();

      const bookmarked =
        current !== null &&
        state.bookmarks.includes(current);

      $("bookmark").textContent = bookmarked
        ? "★ Bookmarked"
        : "☆ Bookmark";

      $("bookmark").setAttribute(
        "aria-pressed",
        String(bookmarked)
      );

      $("bookmark").disabled = !current;
    }

    /* READING PROGRESS */

    function updateReaderProgress() {
      const location = state.currentLocation;

      if (!location) {
        $("reader-progress").textContent =
          "Preparing…";

        $("previous").disabled = true;
        $("next").disabled = true;
        $("page-arrow-left").disabled = true;
        $("page-arrow-right").disabled = true;

        updateBookmarkButton();
        return;
      }

      const start = location.start || {};
      const displayed = start.displayed || {};

      const page =
        Number.isFinite(displayed.page)
          ? displayed.page
          : null;

      const total =
        Number.isFinite(displayed.total)
          ? displayed.total
          : null;

      let label = "";

      if (
        state.locationsReady &&
        state.book &&
        typeof start.cfi === "string"
      ) {
        const fraction =
          state.book.locations.percentageFromCfi(
            start.cfi
          );

        if (Number.isFinite(fraction)) {
          state.progress = Math.max(
            0,
            Math.min(
              100,
              Math.round(fraction * 100)
            )
          );
        }

        label = `${state.progress}% complete`;
      } else if (
        page !== null &&
        total !== null
      ) {
        label = `Page ${page} of ${total}`;
      } else {
        label = "Reading";
      }

      $("reader-progress").textContent = label;

      const previousDisabled =
        state.isNavigating ||
        location.atStart === true;

      const nextDisabled =
        state.isNavigating ||
        location.atEnd === true;

      $("previous").disabled = previousDisabled;
      $("next").disabled = nextDisabled;

      $("page-arrow-left").disabled =
        previousDisabled;

      $("page-arrow-right").disabled =
        nextDisabled;

      updateBookmarkButton();
    }

    function handleRelocation(location) {
      if (!state.isOpen) {
        return;
      }

      const cfi = location?.start?.cfi;

      if (
        typeof cfi !== "string" ||
        !cfi.startsWith("epubcfi(")
      ) {
        return;
      }

      state.currentLocation = location;
      state.currentCfi = cfi;
      state.position = cfi;
      state.hasStarted = true;

      updateReaderProgress();
      saveState();
    }

    async function prepareLocations(book, openingId) {
      try {
        await book.locations.generate(1024);

        if (
          openingId !== state.openingId ||
          !state.isOpen ||
          state.book !== book
        ) {
          return;
        }

        state.locationsReady = true;

        updateReaderProgress();
        saveState();
        renderLibrary();
      } catch (error) {
        console.warn(
          "EPUB percentage calculation unavailable:",
          error
        );
      }
    }

    /* OPEN BOOK */

    async function openBook() {
      if (
        state.isLoading ||
        state.isOpen
      ) {
        return;
      }

      if (
        typeof window.ePub !== "function" ||
        typeof window.JSZip === "undefined"
      ) {
        showLibraryError(
          "The EPUB reading library could not load. " +
          "Please refresh the page and try again."
        );
        return;
      }

      state.isLoading = true;
      state.isOpen = true;
      state.locationsReady = false;
      state.currentLocation = null;
      state.currentCfi = null;

      const openingId = ++state.openingId;

      showLibraryError("");
      renderLibrary();

      $("library").hidden = true;
      $("reader").hidden = false;

      $("reader-loading").hidden = false;
      $("reader-loading").textContent =
        "Preparing your book…";

      $("epub-viewer").hidden = true;

      $("reader-page-arrows").hidden = true;
      $("reader-menu-toggle").hidden = true;

      setControlsVisible(false);
      showStatus("");

      try {
        const bytes = await fetchProtectedEpub();

        if (openingId !== state.openingId) {
          return;
        }

        $("reader-loading").textContent =
          "Opening Gualachulain…";

        const book = window.ePub(bytes);
        state.book = book;

        await book.ready;

        if (openingId !== state.openingId) {
          return;
        }

        $("epub-viewer").hidden = false;

        const rendition = book.renderTo(
          "epub-viewer",
          {
            width: "100%",
            height: "100%",
            manager: "default",
            flow: "paginated",
            spread: "none"
          }
        );

        state.rendition = rendition;

        registerThemes(rendition);
        applyReaderPreferences();

        rendition.on(
          "relocated",
          handleRelocation
        );

        rendition.on(
          "displayError",
          error => {
            console.error(
              "EPUB display error:",
              error
            );

            showStatus(
              "A book page could not be displayed."
            );
          }
        );

        // Only keyboard handling is registered
        // inside the EPUB iframe.
        // Page turning uses the outer HTML arrows.
        rendition.hooks.content.register(
          contents => {
            contents.document.addEventListener(
              "keydown",
              event => {
                if (event.key === "Escape") {
                  event.preventDefault();

                  if (
                    !$("reader-controls").hidden
                  ) {
                    setControlsVisible(false);
                  } else {
                    closeBook();
                  }
                }
              }
            );
          }
        );

        const savedPosition = state.position;

        try {
          await rendition.display(
            savedPosition || undefined
          );
        } catch (error) {
          if (!savedPosition) {
            throw error;
          }

          console.warn(
            "Saved position unavailable; opening start:",
            error
          );

          state.position = null;
          await rendition.display();
        }

        if (openingId !== state.openingId) {
          return;
        }

        $("reader-loading").hidden = true;

        state.isLoading = false;
        state.hasStarted = true;

        // Enable independent navigation arrows
        // and the accessible menu button.
        $("reader-page-arrows").hidden = false;
        $("reader-menu-toggle").hidden = false;

        updateReaderProgress();
        saveState();
        renderLibrary();

        // Calculate percentage after first display.
        void prepareLocations(
          book,
          openingId
        );
      } catch (error) {
        if (openingId !== state.openingId) {
          return;
        }

        console.error(
          "BP Reading failed to open EPUB:",
          error
        );

        const message =
          error instanceof Error
            ? error.message
            : "An unexpected reading error occurred.";

        closeBook();

        showLibraryError(
          `Unable to open Gualachulain: ${message}`
        );
      } finally {
        if (openingId === state.openingId) {
          state.isLoading = false;
          renderLibrary();
        }
      }
    }

    /* CLOSE BOOK */

    function closeBook() {
      ++state.openingId;

      state.isOpen = false;
      state.isLoading = false;
      state.isNavigating = false;
      state.locationsReady = false;
      state.currentLocation = null;
      state.currentCfi = null;

      if (state.rendition) {
        try {
          state.rendition.destroy();
        } catch (error) {
          console.warn(
            "Reader cleanup warning:",
            error
          );
        }
      }

      state.rendition = null;

      if (state.book) {
        try {
          state.book.destroy();
        } catch (error) {
          console.warn(
            "EPUB cleanup warning:",
            error
          );
        }
      }

      state.book = null;

      $("epub-viewer").replaceChildren();
      $("epub-viewer").hidden = true;

      $("reader-page-arrows").hidden = true;
      $("reader-menu-toggle").hidden = true;

      $("reader").hidden = true;
      $("library").hidden = false;

      setControlsVisible(false);
      showStatus("");

      saveState();
      renderLibrary();
    }

    /* PAGE NAVIGATION */

    async function changePage(direction) {
      if (
        !state.rendition ||
        state.isNavigating ||
        state.isLoading ||
        !state.isOpen
      ) {
        return;
      }

      state.isNavigating = true;
      updateReaderProgress();

      try {
        if (direction > 0) {
          await state.rendition.next();
        } else {
          await state.rendition.prev();
        }
      } catch (error) {
        console.error(
          "Page navigation failed:",
          error
        );

        showStatus(
          "Unable to turn the page."
        );
      } finally {
        state.isNavigating = false;
        updateReaderProgress();
      }
    }

    /* BUTTON EVENTS */

    $("back-to-library").addEventListener(
      "click",
      closeBook
    );

    $("previous").addEventListener(
      "click",
      () => void changePage(-1)
    );

    $("next").addEventListener(
      "click",
      () => void changePage(1)
    );

    $("page-arrow-left").addEventListener(
      "click",
      () => void changePage(-1)
    );

    $("page-arrow-right").addEventListener(
      "click",
      () => void changePage(1)
    );

    $("reader-menu-toggle").addEventListener(
      "click",
      () => {
        setControlsVisible(
          $("reader-controls").hidden
        );
      }
    );

    $("font-smaller").addEventListener(
      "click",
      () => {
        state.fontSize = Math.max(
          15,
          state.fontSize - 1
        );

        saveState();
        applyReaderPreferences();

        showStatus(
          `Text size: ${state.fontSize}px`
        );
      }
    );

    $("font-larger").addEventListener(
      "click",
      () => {
        state.fontSize = Math.min(
          30,
          state.fontSize + 1
        );

        saveState();
        applyReaderPreferences();

        showStatus(
          `Text size: ${state.fontSize}px`
        );
      }
    );

    $("reading-theme").addEventListener(
      "change",
      event => {
        const requested = event.target.value;

        if (!allowedThemes.includes(requested)) {
          return;
        }

        state.theme = requested;

        saveState();
        applyReaderPreferences();

        showStatus(
          `Theme: ${requested}`
        );
      }
    );

    $("bookmark").addEventListener(
      "click",
      () => {
        const cfi = getCurrentCfi();

        if (!cfi) {
          showStatus(
            "Reading position is not ready."
          );
          return;
        }

        const existing =
          state.bookmarks.indexOf(cfi);

        if (existing >= 0) {
          state.bookmarks.splice(
            existing,
            1
          );

          showStatus(
            "Bookmark removed."
          );
        } else {
          state.bookmarks.push(cfi);

          showStatus(
            "Page bookmarked."
          );
        }

        saveState();
        updateBookmarkButton();
      }
    );

    /* KEYBOARD */

    document.addEventListener(
      "keydown",
      event => {
        if (!state.isOpen) {
          return;
        }

        if (event.key === "Escape") {
          if (!$("reader-controls").hidden) {
            setControlsVisible(false);
          } else {
            closeBook();
          }
        }
      }
    );

    /* ADMIN GATE */

    async function initialise() {
      renderLibrary();

      try {
        await verifyBPReadingAdmin();

        document.documentElement.classList.add(
          "bp-admin-verified"
        );
      } catch (error) {
        console.warn(
          "BP Reading access denied:",
          error.message
        );

        window.location.replace(
          "/pages/members.html"
        );
      }
    }

    await initialise();
  </script>

</body>
</html>
