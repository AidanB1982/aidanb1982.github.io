
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171310">
  <title>BP Reading | Blackwood Publishing</title>
  
<style>
  /* BP Reading: keep the prototype hidden until verified. */
  html:not(.bp-admin-verified) body {
    visibility: hidden;
  }
</style>

  <style>
    :root {
      color-scheme: dark;
      --bg: #171310;
      --panel: #241c17;
      --copper: #c99b6b;
      --border: #49372b;
      --text: #f0e5d7;
      --muted: #b7a594;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
    }

    button, select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:focus-visible,
    select:focus-visible {
      outline: 2px solid var(--copper);
      outline-offset: 3px;
    }

    [hidden] {
      display: none !important;
    }

    .library {
      max-width: 1120px;
      margin: auto;
      padding: 2rem 1.25rem 5rem;
    }

    .library-header {
      border-bottom: 1px solid var(--border);
      padding-bottom: 2rem;
      margin-bottom: 2.5rem;
    }

    .brand {
      color: var(--copper);
      letter-spacing: .2em;
      font-size: 1.1rem;
    }

    .brand-subtitle {
      color: var(--muted);
      font: .7rem Arial, sans-serif;
      letter-spacing: .28em;
      margin-top: .4rem;
    }

    .library h1 {
      margin: 2.5rem 0 .6rem;
      font-weight: normal;
      font-size: clamp(2rem, 5vw, 3rem);
    }

    .library-intro {
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.7;
    }

    .book-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 2rem;
    }

    .book-card {
      border: 1px solid var(--border);
      border-radius: .8rem;
      background: var(--panel);
      overflow: hidden;
      padding: 1rem;
    }

    .book-cover {
      width: 100%;
      aspect-ratio: 2 / 3;
      border: 1px solid #806044;
      border-radius: .4rem;
      background:
        radial-gradient(circle at 50% 35%, #63442e, transparent 60%),
        linear-gradient(145deg, #3c291d, #100e0c);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 2rem 1rem;
      text-align: center;
      box-shadow: inset 0 0 0 8px #ffffff08;
    }

    .book-cover.crossing {
      background:
        radial-gradient(circle at 50% 70%, #46505a, transparent 60%),
        linear-gradient(145deg, #222f3a, #111316);
    }

    .cover-imprint {
      font: .65rem Arial, sans-serif;
      letter-spacing: .2em;
      color: #ddbb91;
    }

    .cover-title {
      font-size: clamp(1.5rem, 4vw, 2rem);
      color: #f3dfc1;
      overflow-wrap: anywhere;
    }

    .cover-footer {
      font: .7rem Arial, sans-serif;
      color: #d3b48f;
      letter-spacing: .12em;
    }

    .book-card h2 {
      font-size: 1.2rem;
      font-weight: normal;
      margin: 1.2rem 0 .35rem;
    }

    .book-description {
      color: var(--muted);
      font: .85rem Arial, sans-serif;
      line-height: 1.5;
      min-height: 2.5rem;
    }

    .progress-label {
      color: var(--muted);
      font: .75rem Arial, sans-serif;
      margin: 1rem 0 .5rem;
    }

    .progress-track {
      height: 5px;
      background: #49372b;
      border-radius: 10px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0;
      background: var(--copper);
      transition: width .2s;
    }

    .open-book {
      width: 100%;
      margin-top: 1.25rem;
      padding: .8rem;
      border: 1px solid var(--copper);
      border-radius: .5rem;
      background: #382719;
      color: #f5dfc7;
    }

    .open-book:hover {
      background: #4c3523;
    }

    .library-note {
      margin-top: 2.5rem;
      color: var(--muted);
      font: .8rem Arial, sans-serif;
      line-height: 1.6;
    }

    /* Immersive reading mode */

    .reader {
      position: fixed;
      inset: 0;
      z-index: 10;
      overflow-y: auto;
      background: #eee0c5;
      color: #30271f;
      scrollbar-width: thin;
    }

    .reader[data-theme="day"] {
      background: #fffdf7;
      color: #242424;
    }

    .reader[data-theme="night"] {
      background: #201c1a;
      color: #e9dfd2;
    }

    .reading-surface {
      min-height: 100%;
      padding: clamp(3rem, 9vh, 6rem) 1.5rem 7rem;
    }

    .reading-column {
      max-width: 680px;
      margin: auto;
    }

    .reader-book-title {
      text-align: center;
      font: .72rem Arial, sans-serif;
      letter-spacing: .2em;
      opacity: .65;
      margin-bottom: 3.5rem;
    }

    .chapter-title {
      font-size: clamp(1.8rem, 4vw, 2.4rem);
      font-weight: normal;
      text-align: center;
      margin: 0 0 3rem;
    }

    .chapter-text {
      font-size: 19px;
      line-height: 1.85;
    }

    .chapter-text p {
      margin: 0 0 1.5em;
    }

    .chapter-text p:first-child::first-letter {
      float: left;
      font-size: 3.3em;
      line-height: .9;
      padding-right: .12em;
    }

    .sample-label {
      margin-top: 4rem;
      text-align: center;
      font: .75rem Arial, sans-serif;
      opacity: .55;
    }

    /* Controls appear only when requested */

    .reader-controls {
      position: fixed;
      inset: 0 0 auto;
      z-index: 20;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
      padding: 1rem;
      background: #1b1513f2;
      color: #f0e5d7;
      border-bottom: 1px solid #58402e;
      font: .85rem Arial, sans-serif;
    }

    .reader-bottom {
      position: fixed;
      inset: auto 0 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1rem;
      background: #1b1513f2;
      color: #f0e5d7;
      border-top: 1px solid #58402e;
      font: .85rem Arial, sans-serif;
    }

    .control-group {
      display: flex;
      flex-wrap: wrap;
      gap: .5rem;
      align-items: center;
    }

    .control {
      padding: .65rem .8rem;
      border: 1px solid #604631;
      border-radius: .4rem;
      background: #30241c;
      color: #f0e5d7;
    }

    .control:disabled {
      opacity: .35;
      cursor: not-allowed;
    }

    .reader-progress {
      color: #cbb7a3;
      text-align: center;
      font-size: .8rem;
    }

    .reader-status {
      position: fixed;
      bottom: 5.5rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      padding: .5rem .8rem;
      background: #1b1513e8;
      color: #f1cfaa;
      border-radius: .4rem;
      font: .75rem Arial, sans-serif;
      pointer-events: none;
    }

    .reader-status:empty {
      display: none;
    }

    @media (max-width: 650px) {
      .reader-controls,
      .reader-bottom {
        justify-content: center;
      }

      .reader-controls {
        padding: .65rem;
      }

      .reader-bottom {
        gap: .5rem;
      }

      .reading-surface {
        padding-top: 4rem;
      }

      .reader-book-title {
        margin-bottom: 2rem;
      }
    }
  </style>
</head>

<body>
  <main class="library" id="library">
    <header class="library-header">
      <div class="brand">BLACKWOOD</div>
      <div class="brand-subtitle">BP READING</div>

      <h1>My Library</h1>
      <p class="library-intro">
        Your books. Your stories. Your place to disappear for a while.
      </p>
    </header>

    <section class="book-grid" id="book-grid"
      aria-label="Books in your library"></section>

    <p class="library-note">
      Prototype library with demonstration books only.
      No live purchases, entitlements or manuscript files are connected.
    </p>
  </main>

  <section class="reader" id="reader"
    aria-label="Immersive book reader" hidden>

    <div class="reading-surface" id="reading-surface">
      <article class="reading-column">
        <div class="reader-book-title" id="reader-book-title"></div>
        <h1 class="chapter-title" id="chapter-title"></h1>
        <div class="chapter-text" id="chapter-text"></div>
        <p class="sample-label">
          Demonstration content — not an actual Blackwood manuscript.
        </p>
      </article>
    </div>

    <header class="reader-controls" id="reader-controls" hidden>
      <button class="control" id="back-to-library" type="button">
        ← Library
      </button>

      <div class="control-group">
        <button class="control" id="font-smaller" type="button"
          aria-label="Decrease text size">A−</button>
        <button class="control" id="font-larger" type="button"
          aria-label="Increase text size">A+</button>

        <select class="control" id="reading-theme"
          aria-label="Reading theme">
          <option value="parchment">Parchment</option>
          <option value="day">Day</option>
          <option value="night">Night</option>
        </select>

        <button class="control" id="bookmark" type="button"
          aria-pressed="false">☆ Bookmark</button>
      </div>
    </header>

    <nav class="reader-bottom" id="reader-bottom"
      aria-label="Reading navigation" hidden>
      <button class="control" id="previous" type="button">
        ← Previous
      </button>

      <span class="reader-progress" id="reader-progress"></span>

      <button class="control" id="next" type="button">
        Next →
      </button>
    </nav>

    <div class="reader-status" id="reader-status"
      role="status" aria-live="polite"></div>
  </section>

  <script>
    "use strict";

    const books = [
      {
        id: "gualachulain-demo",
        title: "Gualachulain",
        coverClass: "",
        description: "Blackwood Reading Station demonstration edition.",
        chapters: [
          {
            title: "Chapter One",
            paragraphs: [
              "Every story begins somewhere. Some begin with a door opening. Others begin with a secret that should never have been discovered.",
              "Beyond the familiar streets and ordinary days, there are places where stories wait patiently to be told.",
              "This is the first demonstration chapter of our immersive reading experience."
            ]
          },
          {
            title: "Chapter Two",
            paragraphs: [
              "The next chapter brings a new page, a fresh beginning, and the promise of something waiting just beyond the horizon.",
              "A good reading experience should disappear into the background, leaving only the words and the imagination.",
              "Tap the centre of the screen to reveal the reading controls whenever you need them."
            ]
          },
          {
            title: "Chapter Three",
            paragraphs: [
              "Some journeys are measured in miles. Others are measured in the pages we turn.",
              "Your reading position and preferences are remembered on this device.",
              "This concludes the demonstration of Gualachulain in BP Reading."
            ]
          }
        ]
      },
      {
        id: "crossing-demo",
        title: "The Crossing",
        coverClass: "crossing",
        description: "Second demonstration title for the Blackwood library.",
        chapters: [
          {
            title: "Chapter One",
            paragraphs: [
              "The horizon stretched beyond the last familiar landmark, leaving the road ahead wrapped in uncertainty.",
              "There are moments when the simplest journey becomes the beginning of an entirely different life.",
              "This is original placeholder text for the Blackwood Reading Station, not an excerpt from The Crossing."
            ]
          },
          {
            title: "Chapter Two",
            paragraphs: [
              "Morning arrived quietly, casting pale light across the landscape.",
              "The journey continued, carrying questions that had yet to find their answers.",
              "Every book in BP Reading will eventually have its own independently saved reading position."
            ]
          }
        ]
      }
    ];

    const storageKey = "bp-reading-library-demo-v1";

    function loadState() {
      try {
        return JSON.parse(localStorage.getItem(storageKey)) || {};
      } catch {
        return {};
      }
    }

    const saved = loadState();

    const state = {
      activeBookId: null,
      theme: ["parchment", "day", "night"].includes(saved.theme)
        ? saved.theme : "parchment",
      fontSize: Number.isFinite(saved.fontSize)
        ? Math.max(15, Math.min(30, saved.fontSize)) : 19,
      positions: saved.positions &&
        typeof saved.positions === "object" ? saved.positions : {},
      bookmarks: saved.bookmarks &&
        typeof saved.bookmarks === "object" ? saved.bookmarks : {}
    };

    const $ = id => document.getElementById(id);

    function saveState() {
      try {
        localStorage.setItem(storageKey, JSON.stringify({
          theme: state.theme,
          fontSize: state.fontSize,
          positions: state.positions,
          bookmarks: state.bookmarks
        }));
      } catch {
        showStatus("Unable to save preferences on this device.");
      }
    }

    function getBook(bookId) {
      return books.find(book => book.id === bookId);
    }

    function getChapterIndex(book) {
      const value = state.positions[book.id];
      return Number.isInteger(value)
        ? Math.max(0, Math.min(book.chapters.length - 1, value))
        : 0;
    }

    function getProgress(book) {
      const chapter = getChapterIndex(book);
      return Math.round(((chapter + 1) / book.chapters.length) * 100);
    }

    function renderLibrary() {
      const grid = $("book-grid");
      grid.replaceChildren();

      for (const book of books) {
        const card = document.createElement("article");
        card.className = "book-card";

        const cover = document.createElement("div");
        cover.className = "book-cover " + book.coverClass;

        const imprint = document.createElement("div");
        imprint.className = "cover-imprint";
        imprint.textContent = "BLACKWOOD PUBLISHING";

        const coverTitle = document.createElement("div");
        coverTitle.className = "cover-title";
        coverTitle.textContent = book.title;

        const footer = document.createElement("div");
        footer.className = "cover-footer";
        footer.textContent = "BP READING";

        cover.append(imprint, coverTitle, footer);

        const heading = document.createElement("h2");
        heading.textContent = book.title;

        const description = document.createElement("p");
        description.className = "book-description";
        description.textContent = book.description;

        const progressLabel = document.createElement("p");
        progressLabel.className = "progress-label";

        const hasStarted = Object.prototype.hasOwnProperty.call(
          state.positions, book.id
        );

        const progress = hasStarted ? getProgress(book) : 0;
        progressLabel.textContent = hasStarted
          ? progress + "% through demonstration"
          : "Not started";

        const track = document.createElement("div");
        track.className = "progress-track";

        const fill = document.createElement("div");
        fill.className = "progress-fill";
        fill.style.width = progress + "%";
        track.appendChild(fill);

        const button = document.createElement("button");
        button.type = "button";
        button.className = "open-book";
        button.textContent = hasStarted
          ? "Continue Reading"
          : "Read Book";
        button.addEventListener("click", () => openBook(book.id));

        card.append(
          cover, heading, description,
          progressLabel, track, button
        );

        grid.appendChild(card);
      }
    }

    function showStatus(message) {
      $("reader-status").textContent = message;
    }

    function setControlsVisible(visible) {
      $("reader-controls").hidden = !visible;
      $("reader-bottom").hidden = !visible;
    }

    function renderReader() {
      const book = getBook(state.activeBookId);
      if (!book) return;

      const chapterIndex = getChapterIndex(book);
      const chapter = book.chapters[chapterIndex];

      $("reader-book-title").textContent = book.title.toUpperCase();
      $("chapter-title").textContent = chapter.title;

      const container = $("chapter-text");
      container.replaceChildren();

      for (const text of chapter.paragraphs) {
        const paragraph = document.createElement("p");
        paragraph.textContent = text;
        container.appendChild(paragraph);
      }

      container.style.fontSize = state.fontSize + "px";
      $("reader").dataset.theme = state.theme;
      $("reading-theme").value = state.theme;

      const savedBookmarks = Array.isArray(state.bookmarks[book.id])
        ? state.bookmarks[book.id] : [];

      const bookmarked = savedBookmarks.includes(chapterIndex);
      $("bookmark").textContent = bookmarked
        ? "★ Bookmarked" : "☆ Bookmark";
      $("bookmark").setAttribute(
        "aria-pressed", String(bookmarked)
      );

      $("previous").disabled = chapterIndex === 0;
      $("next").disabled = chapterIndex === book.chapters.length - 1;

      $("reader-progress").textContent =
        "Chapter " + (chapterIndex + 1) +
        " of " + book.chapters.length +
        " · " + getProgress(book) + "%";
    }

    function openBook(bookId) {
      const book = getBook(bookId);
      if (!book) return;

      state.activeBookId = bookId;

      if (!Object.prototype.hasOwnProperty.call(
        state.positions, bookId
      )) {
        state.positions[bookId] = 0;
      }

      saveState();
      $("library").hidden = true;
      $("reader").hidden = false;
      $("reader").scrollTop = 0;

      renderReader();
      setControlsVisible(false);
      showStatus("");
    }

    function closeBook() {
      state.activeBookId = null;
      saveState();
      $("reader").hidden = true;
      $("library").hidden = false;
      showStatus("");
      renderLibrary();
    }

    function changeChapter(offset) {
      const book = getBook(state.activeBookId);
      if (!book) return;

      const next = getChapterIndex(book) + offset;
      if (next < 0 || next >= book.chapters.length) return;

      state.positions[book.id] = next;
      saveState();
      renderReader();
      $("reader").scrollTop = 0;
      showStatus("Reading position saved.");
    }

    $("reading-surface").addEventListener("click", () => {
      const visible = !$("reader-controls").hidden;
      setControlsVisible(!visible);
      showStatus("");
    });

    $("back-to-library").addEventListener("click", closeBook);

    $("previous").addEventListener("click", () => changeChapter(-1));
    $("next").addEventListener("click", () => changeChapter(1));

    $("font-smaller").addEventListener("click", () => {
      state.fontSize = Math.max(15, state.fontSize - 1);
      saveState();
      renderReader();
    });

    $("font-larger").addEventListener("click", () => {
      state.fontSize = Math.min(30, state.fontSize + 1);
      saveState();
      renderReader();
    });

    $("reading-theme").addEventListener("change", event => {
      state.theme = event.target.value;
      saveState();
      renderReader();
    });

    $("bookmark").addEventListener("click", () => {
      const book = getBook(state.activeBookId);
      if (!book) return;

      const index = getChapterIndex(book);
      const bookmarks = Array.isArray(state.bookmarks[book.id])
        ? state.bookmarks[book.id] : [];

      const existing = bookmarks.indexOf(index);

      if (existing >= 0) {
        bookmarks.splice(existing, 1);
        showStatus("Bookmark removed.");
      } else {
        bookmarks.push(index);
        showStatus("Chapter bookmarked.");
      }

      state.bookmarks[book.id] = bookmarks;
      saveState();
      renderReader();
    });

    document.addEventListener("keydown", event => {
      if (!state.activeBookId) return;

      if (event.key === "Escape") {
        if (!$("reader-controls").hidden) {
          setControlsVisible(false);
        } else {
          closeBook();
        }
      }
    });

    renderLibrary();
  </script>
  
<script type="module">
  import {
    createClient
  } from "https://esm.sh/@supabase/supabase-js@2";

  const SUPABASE_URL =
    "https://bmnlynjldlnxfvunqbqq.supabase.co";

  const SUPABASE_ANON_KEY =
    "sb_publishable_eL7qdDe_6XWGhzmdsql_7w_7dg6psC0";

  const supabase = createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );

  async function verifyBPReadingAdmin() {
    try {
      const {
        data: { user },
        error: authError
      } = await supabase.auth.getUser();

      if (authError || !user) {
        throw new Error("Authentication required");
      }

      const { data: profile, error: profileError } =
        await supabase
          .from("member_profiles")
          .select("is_admin")
          .eq("id", user.id)
          .single();

      if (profileError || profile?.is_admin !== true) {
        throw new Error("Administrator access required");
      }

      document.documentElement.classList.add(
        "bp-admin-verified"
      );
    } catch (error) {
      console.warn("BP Reading access denied:", error.message);

      // Redirect visitors to the existing member login area.
      window.location.replace("/pages/members.html");
    }
  }

  await verifyBPReadingAdmin();
</script>

</body>
</html>
