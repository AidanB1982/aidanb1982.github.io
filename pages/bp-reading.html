
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >
  <meta name="theme-color" content="#171310">

  <title>BP Reading | Blackwood Publishing</title>

  <style>
    html:not(.bp-admin-verified) body {
      visibility: hidden;
    }
  </style>

  <link rel="stylesheet" href="/css/BP-Reading.css">
</head>

<body>

  <!-- LIBRARY -->

  <main class="library" id="library">

    <header class="library-header">
      <div class="brand">BLACKWOOD</div>
      <div class="brand-subtitle">BP READING</div>

      <h1>My Library</h1>

      <p class="library-intro">
        Your books. Your stories. Your place to
        disappear for a while.
      </p>
    </header>

    <section
      class="book-grid"
      id="book-grid"
      aria-label="Books in your library">
    </section>

    <p
      class="library-error"
      id="library-error"
      role="alert"
      hidden>
    </p>

    <p class="library-note">
      Administrator testing edition.
      Gualachulain is currently the only book
      connected to BP Reading.
    </p>

  </main>

  <!-- READER -->

  <section
    class="reader"
    id="reader"
    data-theme="parchment"
    aria-label="Immersive book reader"
    hidden>

    <div class="reading-surface" id="reading-surface">
      <article class="reading-column">

        <div
          class="reader-book-title"
          id="reader-book-title">
          GUALACHULAIN
        </div>

        <div
          class="reader-loading"
          id="reader-loading"
          role="status">
          Preparing your book…
        </div>

        <div
          class="epub-viewer"
          id="epub-viewer"
          aria-label="Gualachulain book pages"
          hidden>
        </div>

        <!-- DECORATIVE PAGE-TURN OVERLAY -->

        <div
          class="page-turn-overlay"
          id="page-turn-overlay"
          aria-hidden="true"
          hidden>
          <div
            class="page-turn-sheet"
            id="page-turn-sheet">
          </div>
        </div>

      </article>
    </div>

    <!-- PAGE TURNING ARROWS -->

    <nav
      class="reader-page-arrows"
      id="reader-page-arrows"
      aria-label="Turn book pages"
      hidden>

      <button
        class="reader-page-arrow reader-page-arrow-left"
        id="page-arrow-left"
        type="button"
        aria-label="Previous page">
        &#10094;
      </button>

      <button
        class="reader-page-arrow reader-page-arrow-right"
        id="page-arrow-right"
        type="button"
        aria-label="Next page">
        &#10095;
      </button>

    </nav>

    <!-- MENU BUTTON -->

    <button
      class="reader-menu-toggle"
      id="reader-menu-toggle"
      type="button"
      aria-controls="reader-controls"
      aria-expanded="false"
      hidden>
      ☰ Menu
    </button>

    <!-- TOP CONTROLS -->

    <header
      class="reader-controls"
      id="reader-controls"
      hidden>

      <button
        class="control"
        id="back-to-library"
        type="button">
        ← Library
      </button>

      <div class="control-group">

        <button
          class="control"
          id="font-smaller"
          type="button"
          aria-label="Decrease text size">
          A−
        </button>

        <button
          class="control"
          id="font-larger"
          type="button"
          aria-label="Increase text size">
          A+
        </button>

        <select
          class="control"
          id="reading-theme"
          aria-label="Reading theme">

          <option value="parchment">Parchment</option>
          <option value="day">Day</option>
          <option value="night">Night</option>

        </select>

        <button
          class="control"
          id="bookmark"
          type="button"
          aria-pressed="false">
          ☆ Bookmark
        </button>

      </div>
    </header>

    <!-- BOTTOM CONTROLS -->

    <nav
      class="reader-bottom"
      id="reader-bottom"
      aria-label="Reading navigation"
      hidden>

      <button
        class="control"
        id="previous"
        type="button">
        ← Previous
      </button>

      <span
        class="reader-progress"
        id="reader-progress">
        Preparing…
      </span>

      <button
        class="control"
        id="next"
        type="button">
        Next →
      </button>

    </nav>

    <div
      class="reader-status"
      id="reader-status"
      role="status"
      aria-live="polite">
    </div>

  </section>

  <!-- EPUB DEPENDENCIES -->

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"></script>

  <!-- BP READING APPLICATION -->

  <script type="module" src="/js/BP-reading.js"></script>

</body>
</html>
