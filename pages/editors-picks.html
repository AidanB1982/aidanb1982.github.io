<!DOCTYPE html>

<html lang="en" class="no-js">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor’s Picks</title>


<!-- CSS -->
<link rel="stylesheet" href="/css/styles.css">
<link rel="stylesheet" href="/css/editors.css">


</head>

<body class="editors-page sub-page">


<!-- HEADER -->
<div id="header-placeholder"></div>

<main>

    <!-- HERO / OPENING -->
    <section class="opening-line fade-in">
        <p>
            A quiet selection of books currently in rotation.
        </p>
    </section>

    <!-- OPTIONAL SUBTEXT -->
    <section class="about-snippet fade-in">
        <p>
            What has been sitting close lately.
        </p>
    </section>

    <!-- MONTH TITLE -->
    <section class="fade-in">
        <h2 class="month-title">Current Selection</h2>
    </section>

    <!-- PICKS (JS INJECTS HERE) -->
    <section class="editor-picks">
        <div class="editor-inner">
            <!-- Books will be dynamically injected -->
        </div>
    </section>

    <!-- AFFILIATE NOTE -->
    <section class="fade-in">
        <p class="affiliate-note">
            Some links may be affiliate links.
        </p>
    </section>

</main>

<!-- FOOTER -->
<div id="footer-placeholder"></div>

<!-- JS -->
<script src="/js/header.js" defer></script>
<script src="/js/editors.js" defer></script>

<!-- INIT -->
<script>
window.addEventListener("DOMContentLoaded", async () => {

    if (typeof loadHeader !== "function") {
        console.error("loadHeader not found");
        return;
    }

    await loadHeader("simple");

    requestAnimationFrame(() => {
        loadEditorPicks();
    });

});
</script>


</body>

</html>
