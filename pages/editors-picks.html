<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Editor’s Picks</title>

    <!-- CSS -->
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/editors.css">
</head>

<body class="editors-page" data-page="editors">

    <!-- HEADER -->
    <div id="header-placeholder"></div>

    <!-- HERO / OPENING -->
    <section class="opening-line fade-in">
        <p>
            A quiet selection of books currently in rotation.
        </p>
    </section>

    <!-- OPTIONAL SUBTEXT -->
    <section class="about-snippet fade-in">
        <p>
            Not recommendations. Just what has been sitting close lately.
        </p>
    </section>

    <!-- MONTH TITLE -->
    <section class="fade-in">
        <h2 class="month-title">Current Selection</h2>
    </section>

    <!-- PICKS (CMS WILL INJECT HERE) -->
    <section class="editor-picks">
        <div class="editor-inner">
            <!-- JS WILL POPULATE BOOKS HERE -->
        </div>
    </section>

    <!-- AFFILIATE NOTE -->
    <section class="fade-in">
        <p class="affiliate-note">
            Some links may be affiliate links.
        </p>
    </section>

    <!-- FOOTER -->
    <div id="footer-placeholder"></div>

    <!-- JS -->
    <script src="/js/main.js"></script>
    <script src="/js/editors.js"></script>

    <script>
        loadHeader("simple");
    </script>

</body>
</html>
