<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor’s Picks</title>


<!-- CSS -->
<link rel="stylesheet" href="/css/main.css">
<link rel="stylesheet" href="/css/editors.css">


</head>

<body class="editors-page" data-page="editors">


<!-- HEADER -->
<div id="header-placeholder"></div>

<main>

    <!-- HERO / OPENING -->
    <section class="opening-line fade-in">
        <p>
            A quiet selection of books currently in rotation.
        </p>
    </section>

    <!-- OPTIONAL SUBTEXT -->
    <section class="about-snippet fade-in">
        <p>
            Not recommendations. Just what has been sitting close lately.
        </p>
    </section>

    <!-- MONTH TITLE -->
    <section class="fade-in">
        <h2 class="month-title">Current Selection</h2>
    </section>

    <!-- PICKS (JS INJECTS HERE) -->
    <section class="editor-picks">
        <div class="editor-inner">
            <!-- Books will be dynamically injected -->
        </div>
    </section>

    <!-- AFFILIATE NOTE -->
    <section class="fade-in">
        <p class="affiliate-note">
            Some links may be affiliate links.
        </p>
    </section>

</main>

<!-- FOOTER -->
<div id="footer-placeholder"></div>

<!-- JS -->
<script src="/js/main.js" defer></script>
<script src="/js/editors.js" defer></script>

<!-- INIT -->
<script defer>
window.addEventListener("DOMContentLoaded", async () => {
    await loadHeader("simple");
    loadEditorPicks(); // 🔥 run AFTER layout is ready
});
</script>


</body>

</html>
