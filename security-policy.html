<style>
    /*
        SECURITY POLICY PAGE FIXES
        - Separates fixed/header area from hero title
        - Improves text contrast/readability
        - Moves the seal behind the content with low opacity
        - Adds stronger mobile spacing
    */

    #header-placeholder {
        position: relative;
        z-index: 50;
    }

    .security-hero {
        position: relative;
        min-height: 620px;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        text-align: center;
        padding: 230px 24px 100px;
        background:
            linear-gradient(
                180deg,
                rgba(0, 0, 0, 0.96) 0%,
                rgba(8, 8, 8, 0.94) 28%,
                rgba(12, 12, 12, 0.9) 58%,
                rgba(15, 15, 15, 0.96) 100%
            );
        overflow: hidden;
        border-bottom: 1px solid rgba(201, 169, 106, 0.16);
    }

    .security-hero::before {
        content: "";
        position: absolute;
        inset: 0;
        background: url("/assets/seal.png") center 185px / 300px no-repeat;
        opacity: 0.16;
        filter: grayscale(1);
        pointer-events: none;
        z-index: 1;
    }

    .security-hero::after {
        content: "";
        position: absolute;
        inset: 0;
        background:
            radial-gradient(circle at center 48%, rgba(201, 169, 106, 0.12), transparent 34%),
            linear-gradient(90deg, rgba(0,0,0,0.55), transparent 28%, transparent 72%, rgba(0,0,0,0.55));
        pointer-events: none;
        z-index: 2;
    }

    .security-hero-content {
        position: relative;
        z-index: 3;
        max-width: 860px;
        margin: 0 auto;
        padding: 22px 20px 28px;
        background: rgba(0, 0, 0, 0.28);
        border: 1px solid rgba(201, 169, 106, 0.16);
        border-radius: 18px;
        backdrop-filter: blur(2px);
    }

    .security-intro-line {
        margin: 0 0 14px;
        font-size: 0.78rem;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: #d6b56d;
        font-family: Arial, Helvetica, sans-serif;
        font-weight: 700;
        text-shadow: 0 2px 12px rgba(0, 0, 0, 0.95);
    }

    .security-hero h1 {
        margin: 0;
        font-size: clamp(3rem, 7vw, 5.4rem);
        line-height: 1.02;
        color: #ffffff;
        font-weight: 500;
        text-shadow:
            0 4px 18px rgba(0, 0, 0, 0.95),
            0 0 36px rgba(0, 0, 0, 0.75);
    }

    .security-hero-subtitle {
        max-width: 760px;
        margin: 24px auto 0;
        color: rgba(255, 255, 255, 0.94);
        font-size: 1.12rem;
        line-height: 1.75;
        font-weight: 500;
        text-shadow:
            0 3px 12px rgba(0, 0, 0, 0.95),
            0 0 24px rgba(0, 0, 0, 0.75);
    }

    .security-section {
        padding: 80px 24px;
        background: #f8f6f1;
    }

    .security-wrap {
        width: min(100%, 980px);
        margin: 0 auto;
    }

    .security-meta {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
        margin-bottom: 28px;
        font-family: Arial, Helvetica, sans-serif;
    }

    .security-meta span {
        display: inline-flex;
        align-items: center;
        padding: 8px 14px;
        border: 1px solid #ded8cf;
        border-radius: 999px;
        background: #fff;
        color: #555;
        font-size: 0.92rem;
    }

    .security-card {
        background: #fff;
        border: 1px solid #ded8cf;
        border-radius: 18px;
        box-shadow: 0 18px 45px rgba(0, 0, 0, 0.08);
        overflow: hidden;
    }

    .security-notice {
        padding: 22px 26px;
        background: #f3ece5;
        border-bottom: 1px solid #ded8cf;
        color: #3d3029;
        font-family: Arial, Helvetica, sans-serif;
        line-height: 1.7;
    }

    .security-notice strong {
        color: #4a2b1d;
    }

    .security-content {
        padding: clamp(24px, 5vw, 48px);
        color: #1f1f1f;
        line-height: 1.75;
    }

    .security-content section {
        padding: 30px 0;
        border-bottom: 1px solid #ded8cf;
    }

    .security-content section:first-child {
        padding-top: 0;
    }

    .security-content section:last-child {
        padding-bottom: 0;
        border-bottom: 0;
    }

    .security-content h2 {
        margin: 0 0 14px;
        color: #111;
        font-size: clamp(1.45rem, 3vw, 2rem);
        line-height: 1.25;
        font-weight: 500;
    }

    .security-content p {
        margin: 0 0 16px;
    }

    .security-content p:last-child {
        margin-bottom: 0;
    }

    .security-content ul,
    .security-content ol {
        margin: 12px 0 18px;
        padding-left: 1.4rem;
    }

    .security-content li {
        margin: 7px 0;
    }

    .security-content a {
        color: #5a2f1d;
        text-decoration-thickness: 1px;
        text-underline-offset: 3px;
    }

    .security-content a:hover,
    .security-content a:focus {
        color: #4a2b1d;
        text-decoration-thickness: 2px;
    }

    .security-contact-card {
        margin: 18px 0;
        padding: 20px;
        background: #fbfaf7;
        border: 1px solid #ded8cf;
        border-radius: 14px;
        font-family: Arial, Helvetica, sans-serif;
    }

    .security-contact-card p {
        margin-bottom: 8px;
    }

    .security-contact-card p:last-child {
        margin-bottom: 0;
    }

    .security-code {
        padding: 3px 7px;
        background: #f2eee8;
        border: 1px solid #e6ddd3;
        border-radius: 5px;
        color: #3d3029;
        font-family: "Courier New", Courier, monospace;
        font-size: 0.95em;
    }

    .security-txt {
        margin-top: 18px;
        padding: 18px;
        overflow-x: auto;
        background: #1f1f1f;
        color: #f8f6f1;
        border-radius: 12px;
        font-family: "Courier New", Courier, monospace;
        font-size: 0.92rem;
        line-height: 1.6;
        white-space: pre;
    }

    .skip-link {
        position: absolute;
        top: -100px;
        left: 1rem;
        z-index: 9999;
        padding: 0.75rem 1rem;
        background: #4a2b1d;
        color: #fff;
        border-radius: 8px;
        font-family: Arial, Helvetica, sans-serif;
    }

    .skip-link:focus {
        top: 1rem;
    }

    @media (max-width: 900px) {
        .security-hero {
            min-height: 560px;
            padding-top: 205px;
            padding-bottom: 82px;
        }

        .security-hero::before {
            background-size: 250px;
            background-position: center 170px;
        }
    }

    @media (max-width: 700px) {
        .security-hero {
            min-height: 520px;
            padding: 175px 18px 70px;
        }

        .security-hero::before {
            background-size: 210px;
            background-position: center 145px;
            opacity: 0.12;
        }

        .security-hero-content {
            padding: 20px 16px 24px;
            border-radius: 14px;
        }

        .security-intro-line {
            font-size: 0.72rem;
            letter-spacing: 0.22em;
        }

        .security-hero h1 {
            font-size: clamp(2.55rem, 13vw, 4rem);
        }

        .security-hero-subtitle {
            font-size: 1rem;
            line-height: 1.65;
        }

        .security-section {
            padding: 54px 14px;
        }

        .security-card {
            border-radius: 14px;
        }

        .security-notice {
            padding: 18px;
        }

        .security-content {
            padding: 22px;
        }

        .security-content section {
            padding: 24px 0;
        }

        .security-meta {
            justify-content: flex-start;
        }
    }

    @media print {
        .security-hero,
        #header-placeholder,
        #footer-placeholder,
        .skip-link {
            display: none;
        }

        .security-section {
            padding: 0;
            background: #fff;
        }

        .security-card {
            box-shadow: none;
            border: none;
        }

        .security-content {
            padding: 0;
        }
    }
</style>
