
name: Refresh Scottish bookshop directory
 
on:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 0"

permissions:
  contents: write

concurrency:
  group: bookshop-discovery
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch OpenStreetMap bookshops
        run: node scripts/update-bookshops.mjs

      - name: Commit updated data
        run: |
          if git diff --quiet -- data/scotland-bookshops.json; then
            echo "No changes to bookshop data."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/scotland-bookshops.json
          git commit -m "Update Scottish bookshop discovery data"
          git push
