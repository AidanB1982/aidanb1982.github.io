<!DOCTYPE html>
<html>
<head>
<title>Contact | Blackwood Publishing</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="Blackwood Publishing is an independent imprint publishing literary and psychological fiction shaped by place, memory, and atmosphere.">

<style>

body {
    margin: 0;
    font-family: Georgia, serif;
    background-image: url('stone.png');
    background-size: cover;
    background-attachment: fixed;
    color: #1C1C1C;
    -webkit-font-smoothing: antialiased;
}

/* HEADER (CONSISTENT) */
.header {
    position: relative;
    height: 35vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
}

.header-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(rgba(22,22,25,0.8), rgba(22,22,25,0.8)),
    url('forest.png');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
}

.header-inner {
    position: relative;
    z-index: 1;
}

.header-logo {
    width: 150px;
    margin-bottom: 10px;
}

.header h1 {
    color: #F1F1F1;
    font-weight: 500;
    letter-spacing: 2px;
}

/* NAV */
.nav a {
    margin: 0 16px;
    text-decoration: none;
    color: #F1F1F1;
    font-size: 13px;
    letter-spacing: 1.6px;
    text-transform: uppercase;
    opacity: 0.9;
}

.nav a:hover {
    opacity: 1;
}

/* SECTION */
.section {
    padding: 70px 20px;
    text-align: center;
    background-color: rgba(232, 228, 220, 0.6);
    margin: -40px auto 0;
    width: 90%;
    max-width: 700px;
}

.section p {
    max-width: 520px;
    margin: 15px auto;
    line-height: 1.7;
}

/* DIVIDER */
.divider {
    width: 80px;
    height: 1px;
    background: rgba(0,0,0,0.3);
    margin: 40px auto;
}

/* FORM (REFINED STYLE) */
.contact-form {
    margin-top: 30px;
    display: flex;
    flex-direction: column;
    gap: 25px;
}

/* INPUTS */
.contact-form input,
.contact-form textarea {
    border: none;
    border-bottom: 1px solid rgba(0,0,0,0.25);
    background: transparent;
    padding: 10px 0;

    font-family: Georgia, serif;
    font-size: 15px;
    color: #1C1C1C;
}

/* PLACEHOLDER */
.contact-form input::placeholder,
.contact-form textarea::placeholder {
    color: rgba(0,0,0,0.45);
    letter-spacing: 0.5px;
}

/* FOCUS */
.contact-form input:focus,
.contact-form textarea:focus {
    outline: none;
    border-bottom: 1px solid #5F7D76;
}

/* TEXTAREA */
.contact-form textarea {
    resize: vertical;
    min-height: 120px;
}

/* BUTTON */
.contact-form button {
    margin-top: 10px;
    background: none;
    border: none;

    font-family: Georgia, serif;
    font-size: 14px;
    letter-spacing: 1px;

    color: #5F7D76;
    cursor: pointer;
}

/* BUTTON HOVER */
.contact-form button:hover {
    opacity: 0.6;
}

/* FOOTER */
.footer {
    position: relative;
    width: 100%;
    padding: 90px 20px 70px;
    margin-top: 80px;
    color: #F1F1F1;
    overflow: hidden;
}

.footer::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(rgba(18,18,20,0.85), rgba(18,18,20,0.85)),
    url('forest.png');
    background-size: cover;
    background-position: center;
}

.footer::after {
    content: "";
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 80%;
    height: 1px;
    background: rgba(255,255,255,0.08);
}

.footer-content {
    position: relative;
    z-index: 1;
    max-width: 1100px;
    margin: 0 auto;

    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
}

.footer-left p {
    margin: 4px 0;
    font-size: 14px;
    opacity: 0.85;
}

.footer-center img {
    width: 70px;
    filter: invert(1);
    opacity: 0.9;
}

.footer-right a {
    margin-left: 18px;
    text-decoration: none;
    color: #F1F1F1;
    font-size: 13px;
    letter-spacing: 1px;
    opacity: 0.85;
}

.footer-right a:hover {
    opacity: 1;
}

/* MOBILE */
@media (max-width: 768px) {
    .footer-content {
        flex-direction: column;
        text-align: center;
    }
}

</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
    <div class="header-overlay"></div>

    <div class="header-inner">
        <img src="logo (1).png" class="header-logo">

        <div class="nav">
            <a href="index.html">Home</a>
            <a href="publications.html">Publications</a>
            <a href="about.html">About</a>
            <a href="author.html">Author</a>
            <a href="contact.html">Contact</a>
        </div>

        <h1>Contact</h1>
    </div>
</div>

<!-- CONTENT -->
<div class="section">

<p>
    For enquiries, collaborations, or general correspondence, use the form below.
</p>

<div class="divider"></div>

<form action="https://formspree.io/f/mbdpplkw" method="POST" class="contact-form">

    <input type="text" name="name" placeholder="Name" required>
    <input type="email" name="email" placeholder="Email" required>
    <textarea name="message" placeholder="Message" required></textarea>

    <input type="hidden" name="_redirect" value="https://yourdomain.com/thank-you.html">

    <button type="submit">Send Message</button>

</form>

</div>

<!-- FOOTER -->
<div class="footer">
    <div class="footer-content">

        <div class="footer-left">
            <p>Blackwood Publishing</p>
            <p>Independent Literary Imprint</p>
        </div>

        <div class="footer-center">
            <img src="seal.png">
        </div>

        <div class="footer-right">
            <a href="publications.html">Publications</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </div>

    </div>
</div>

</body>
</html>
