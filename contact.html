<!DOCTYPE html>
<html>
<head>
    <title>Contact | Blackwood Publishing</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Blackwood Publishing is an independent imprint publishing literary and psychological fiction shaped by place, memory, and atmosphere.">

    <meta name="keywords" content="literary fiction, psychological fiction, independent publisher, Scottish fiction, atmospheric fiction, Aidan Blackwood">

    <meta name="author" content="Aidan Blackwood">
    <meta property="og:title" content="Blackwood Publishing">
    <meta property="og:description" content="Literary and psychological fiction shaped by place, memory, and unease.">
    <meta property="og:image" content="https://blackwoodpublishing.co.uk/preview.jpg">
    <meta property="og:url" content="https://blackwoodpublishing.co.uk/">
    <meta property="og:type" content="website">

    <style>
        body {
            margin: 0;
            font-family: Georgia, serif;
            background-image: url('stone.png');
            background-size: cover;
            background-attachment: fixed;
            color: #2c2c2c;
        }

        /* HEADER */
        .header {
            position: relative;
            height: 35vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .header-overlay {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                rgba(22,22,25,0.85),
                rgba(22,22,25,0.85)
            ),
            url('forest.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .header-inner {
            position: relative;
            z-index: 1;
        }

        .header-logo {
            width: 160px;
            margin-bottom: 10px;
        }

        .nav a {
            margin: 0 15px;
            text-decoration: none;
            color: #F1F1F1;
            font-size: 14px;
            letter-spacing: 1px;
        }

        .header h1 {
            color: #F1F1F1;
            font-weight: normal;
            letter-spacing: 2px;
        }

        /* SECTION */
        .section {
            padding: 60px 20px;
            text-align: center;
            background-color: rgba(232, 228, 220, 0.55);
            margin: -30px auto 0;
            width: 90%;
            max-width: 800px;
        }

        .section p {
            max-width: 600px;
            margin: 15px auto;
            line-height: 1.7;
        }

        .divider {
            width: 80px;
            height: 1px;
            background: #999;
            margin: 40px auto;
        }

        /* FORM */
        .contact-form {
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .contact-form input,
        .contact-form textarea {
            padding: 12px;
            border: 1px solid rgba(0,0,0,0.2);
            background: rgba(255,255,255,0.6);
            font-family: Georgia, serif;
            font-size: 14px;
        }

        .contact-form textarea {
            resize: vertical;
        }

        .contact-form button {
            padding: 12px;
            background: #5F7D76;
            color: #fff;
            border: none;
            cursor: pointer;
            font-family: Georgia, serif;
        }

        .contact-form button:hover {
            background: #4e6a63;
        }

        /* FOOTER */
        .footer {
    position: relative;
    width: 100%;
    padding: 90px 20px 70px;
    margin-top: 80px;
    color: #F1F1F1;
    box-sizing: border-box;
    overflow: hidden;
}

/* background */
.footer::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(
        rgba(18,18,20,0.85),
        rgba(18,18,20,0.85)
    ),
    url('forest.png');
    background-size: cover;
    background-position: center;
    z-index: 0;
}

/* subtle top divider */
.footer::after {
    content: "";
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 80%;
    height: 1px;
    background: rgba(255,255,255,0.08);
}

/* layout */
.footer-content {
    position: relative;
    z-index: 1;
    max-width: 1100px;
    margin: 0 auto;

    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 40px;
    flex-wrap: wrap;
}

/* LEFT */
.footer-left p {
    margin: 4px 0;
    font-size: 14px;
    opacity: 0.85;
}

/* CENTER (seal) */
.footer-center img {
    width: 70px;
    filter: invert(1);
    opacity: 0.9;
}

/* RIGHT NAV */
.footer-right a {
    margin-left: 18px;
    text-decoration: none;
    color: #F1F1F1;
    font-size: 13px;
    letter-spacing: 1px;
    opacity: 0.85;
    transition: all 0.25s ease;
}

.footer-right a:hover {
    opacity: 1;
    letter-spacing: 1.5px;
}

    </style>
</head>

<body>

<!-- HEADER -->
<div class="header">
    <div class="header-overlay"></div>

    <div class="header-inner">
        <img src="logo (1).png" class="header-logo">

        <div class="nav">
            <a href="index.html">Home</a>
            <a href="publications.html">Publications</a>
            <a href="about.html">About</a>
            <a href="author.html">Author</a>
            <a href="contact.html">Contact</a>
        </div>

        <h1>Contact</h1>
    </div>
</div>

<!-- CONTENT -->
<div class="section">

    <p>
        For enquiries, collaborations, or general correspondence, use the form below.
    </p>

    <div class="divider"></div>

    <!-- FORM -->
    <form action="https://formspree.io/f/mbdpplkw" method="POST" class="contact-form">

    <input type="text" name="name" placeholder="Name" required>
    <input type="email" name="email" placeholder="Email" required>
    <textarea name="message" placeholder="Message" rows="6" required></textarea>

    <input type="hidden" name="_redirect" value="https://yourdomain.com/thank-you.html">

    <button type="submit">Send Message</button>

</form>

</div>

<!-- FOOTER -->
<div class="footer">
    <div class="footer-content">

        <div class="footer-left">
            <p>Blackwood Publishing</p>
            <p>Independent Literary Imprint</p>
        </div>

        <div class="footer-center">
            <img src="seal.png">
        </div>

        <div class="footer-right">
            <a href="publications.html">Publications</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </div>

    </div>
</div>

</body>
</html>
