<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blackwood Publishing</title>

<style>

/* ================= BASE ================= */
body {
    margin: 0;
    font-family: Georgia, serif;
    background: #111;
    color: #e6e6e6;
    overflow-x: hidden;
}

/* STONE TEXTURE */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: url('stone.png');
    opacity: 0.12;
    z-index: -2;
}

/* GRAIN */
body::after {
    content: "";
    position: fixed;
    inset: 0;
    background: url('https://grainy-gradients.vercel.app/noise.svg');
    opacity: 0.04;
    pointer-events: none;
}

/* ================= NAV ================= */
.nav {
    position: absolute;
    top: 30px;
    right: 60px;
    z-index: 10;
}

/* 🔥 FIX: FORCE WHITE LINKS */
.nav a,
.nav a:visited,
.nav a:active {
    color: #f1f1f1;
    text-decoration: none;
    margin-left: 24px;
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    opacity: 0.75;
    transition: 0.3s;
}

.nav a:hover {
    opacity: 1;
}

/* ================= HERO ================= */
.hero {
    position: relative;
    height: 90vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
}

.hero::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
        linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.9)),
        url('forest.png');
    background-size: cover;
}

/* 🔥 FIX: USE YOUR LOCAL fog.png */
.hero::after {
    content: "";
    position: absolute;
    inset: 0;
    background: url('fog.png');
    background-size: cover;
    opacity: 0.08;
    animation: fog 90s linear infinite; /* slower = premium */
}

/* FOG ANIMATION */
@keyframes fog {
    from { transform: translateX(0); }
    to { transform: translateX(-300px); }
}

.hero-inner {
    position: relative;
    z-index: 2;
}

.hero img {
    width: 220px;
    margin-bottom: 20px;
    animation: fadeUp 1.5s forwards;
}

.hero p {
    animation: fadeUp 2.2s forwards;
}

.button {
    display: inline-block;
    margin-top: 15px;
    font-size: 12px;
    letter-spacing: 2px;
    border-bottom: 1px solid rgba(255,255,255,0.4);
}

/* ================= BOOK STRIP ================= */
.books {
    padding: 80px 0;
    overflow: hidden;
}

.book-row {
    display: flex;
    gap: 40px;
}

.book img {
    width: 160px;
    cursor: pointer;
    transition: 0.3s;
    filter: drop-shadow(0 30px 70px rgba(0,0,0,0.8));
}

.book img:hover {
    transform: scale(1.05) translateY(-6px);
}

/* ================= MODAL ================= */
.modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: 0.4s;
}

.modal.active {
    opacity: 1;
    pointer-events: all;
}

.modal-content {
    background: #111;
    padding: 40px;
    max-width: 500px;
    text-align: center;
    border: 1px solid rgba(255,255,255,0.1);
}

.modal img {
    width: 180px;
    margin-bottom: 20px;
}

.modal a {
    display: inline-block;
    margin-top: 15px;
    border-bottom: 1px solid rgba(255,255,255,0.4);
}

.close {
    position: absolute;
    top: 30px;
    right: 40px;
    font-size: 20px;
    cursor: pointer;
}

/* ================= ANIMATION ================= */
@keyframes fadeUp {
    from { opacity: 0; transform: translateY(25px); }
    to { opacity: 1; transform: translateY(0); }
}

</style>
</head>

<body>

<!-- NAV -->
<div class="nav">
<a href="#">Home</a>
<a href="#">Publications</a>
<a href="#">About</a>
<a href="#">Author</a>
<a href="#">Contact</a>
</div>

<!-- HERO -->
<div class="hero">
<div class="hero-inner">
<img src="logo (1).png">
<p>Literary and psychological fiction shaped by place, memory, and unease.</p>
<a href="#" class="button">Explore Publications</a>
</div>
</div>

<!-- BOOK STRIP -->
<div class="books">
<div class="book-row">

<div class="book"><img src="A3.png" data-id="A3"></div>
<div class="book"><img src="A12.png" data-id="A12"></div>
<div class="book"><img src="A6.png" data-id="A6"></div>
<div class="book"><img src="A7.png" data-id="A7"></div>
<div class="book"><img src="A4.png" data-id="A4"></div>
<div class="book"><img src="A9.png" data-id="A9"></div>
<div class="book"><img src="A5.png" data-id="A5"></div>
<div class="book"><img src="A11.png" data-id="A11"></div>
<div class="book"><img src="A2.png" data-id="A2"></div>
<div class="book"><img src="A8.png" data-id="A8"></div>
<div class="book"><img src="A1.png" data-id="A1"></div>

</div>
</div>

<!-- MODAL -->
<div class="modal" id="modal">
<div class="close" id="close">✕</div>
<div class="modal-content">
<img id="modalImg">
<h2 id="modalTitle"></h2>
<p id="modalDesc"></p>
<a id="modalLink" target="_blank">View / Buy →</a>
</div>
</div>

<script>

/* BOOK DATA */
const books = {
A3:{title:"Camban Bothy",desc:"The Third Calling PREORDER",link:"https://mybook.to/Camban"},
A12:{title:"Dour Hill House",desc:"Psychological Gothic Horror",link:"https://mybook.to/DourHillHouse"},
A6:{title:"The Erased Archivist",desc:"They control the past.",link:"https://mybook.to/ErasedArchivist"},
A7:{title:"The Drowned Fjord",desc:"Ancient sea myths.",link:"https://mybook.to/DrownedFjord"},
A4:{title:"Gualachulain Bothy",desc:"Highland horror.",link:"https://mybook.to/Gualachulain"},
A9:{title:"Corrour Bothy",desc:"Haunted bothy novel.",link:"https://mybook.to/Corrour"},
A5:{title:"Holdfast",desc:"Memory and voices PREORDER",link:"https://mybook.to/Holdfast"},
A11:{title:"Red Streets",desc:"Scottish crime thriller.",link:"https://mybook.to/RedStreets"},
A2:{title:"Echoes of Vengeance",desc:"Psychological revenge thriller.",link:"https://mybook.to/echoesofvengeance"},
A8:{title:"The Black Bothy",desc:"Folk horror novel.",link:"https://mybook.to/BlackBothy"},
A1:{title:"Corrour Limited Edition",desc:"Founders print.",link:"https://pay.tide.co/products/corrour-bot-5KdqBmDa/landing"}
};

/* MODAL */
const modal = document.getElementById("modal");

document.querySelectorAll(".book img").forEach(img=>{
img.onclick=()=>{
const d=books[img.dataset.id];
modal.classList.add("active");
modalImg.src=img.src;
modalTitle.innerText=d.title;
modalDesc.innerText=d.desc;
modalLink.href=d.link;
};
});

close.onclick=()=>modal.classList.remove("active");
modal.onclick=e=>{if(e.target===modal)modal.classList.remove("active");};

</script>

</body>
</html>
