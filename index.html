<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blackwood Publishing</title>

<!-- =========================
     CSS
========================= -->
<style>

/* BASE */
body {
    margin: 0;
    font-family: Georgia, serif;
    background: #0f0f11;
    color: #e6e6e6;
}

/* HERO */
.hero {
    position: relative;
    height: 65vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    overflow: hidden;
}

/* BACKGROUND */
.hero::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
        linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.7)),
        url('forest.png') center/cover no-repeat;
    z-index: 0;
}

/* LIGHT + FOG */
.hero::after {
    content: "";
    position: absolute;
    inset: 0;

    background:
        url('fog.png'),
        radial-gradient(circle at var(--mx,50%) var(--my,50%), rgba(255,255,255,0.12), transparent 40%);

    opacity: 0.2;

    animation: fogMove 120s linear infinite;

    mix-blend-mode: screen;
    pointer-events: none;
    z-index: 1;
}

/* EXTRA FOG */
.fog-layer {
    position: absolute;
    inset: 0;
    background: url('fog.png');
    opacity: 0.05;
    animation: fogFast 60s linear infinite;
}

/* CONTENT */
.hero-inner {
    position: relative;
    z-index: 2;
    max-width: 600px;
    transition: transform 0.2s ease-out;
}

/* LOGO */
.hero-logo {
    width: 320px;
    max-width: 80%;
    margin-bottom: 10px;
}

/* NAV INLINE */
.nav-inline {
    margin: 15px 0;
}

.nav-inline a {
    margin: 0 12px;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    opacity: 0.7;
    transition: 0.3s;
}

.nav-inline a:hover {
    opacity: 1;
}

/* TEXT */
.hero p {
    opacity: 0.85;
    line-height: 1.7;
}

/* BUTTON */
.button {
    display: inline-block;
    margin-top: 20px;
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    border-bottom: 1px solid rgba(255,255,255,0.4);
    padding-bottom: 4px;
    opacity: 0.85;
}

/* ANIMATIONS */
@keyframes fogMove {
    from { transform: translateX(0); }
    to { transform: translateX(-600px); }
}

@keyframes fogFast {
    from { transform: translateX(0); }
    to { transform: translateX(-800px); }
}

</style>
</head>

<body>

<!-- =========================
     HEADER HTML
========================= -->
<section class="hero">

    <div class="fog-layer"></div>

    <div class="hero-inner">

        <img src="logo (1).png" class="hero-logo">

        <div class="nav-inline">
            <a href="#">Home</a>
            <a href="#">Publications</a>
            <a href="#">About</a>
            <a href="#">Author</a>
            <a href="#">Contact</a>
        </div>

        <p>
        Independent publisher of literary and psychological fiction shaped by place, memory, and unease.
        </p>

        <a href="#" class="button">Explore Publications</a>

    </div>

</section>

<!-- =========================
     JAVASCRIPT
========================= -->
<script>

const hero = document.querySelector('.hero');

let targetX = 50, targetY = 50;
let currentX = 50, currentY = 50;

/* LIGHT FOLLOW */
hero.addEventListener('mousemove', e => {
    const rect = hero.getBoundingClientRect();

    targetX = ((e.clientX - rect.left) / rect.width) * 100;
    targetY = ((e.clientY - rect.top) / rect.height) * 100;
});

/* SMOOTH LIGHT */
function animateHero() {
    currentX += (targetX - currentX) * 0.05;
    currentY += (targetY - currentY) * 0.05;

    hero.style.setProperty('--mx', currentX + '%');
    hero.style.setProperty('--my', currentY + '%');

    requestAnimationFrame(animateHero);
}
animateHero();

/* PARALLAX */
const inner = document.querySelector('.hero-inner');

hero.addEventListener('mousemove', e => {
    const rect = hero.getBoundingClientRect();

    const x = (e.clientX - rect.left) / rect.width - 0.5;
    const y = (e.clientY - rect.top) / rect.height - 0.5;

    inner.style.transform = `
        translate(${x * 10}px, ${y * 10}px)
        scale(1.02)
    `;
});

hero.addEventListener('mouseleave', () => {
    inner.style.transform = `translate(0,0) scale(1)`;
});

</script>

</body>
</html>
