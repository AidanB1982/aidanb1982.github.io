<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blackwood Publishing</title>

<!-- GSAP -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

<style>

/* BASE */
body {
    margin: 0;
    font-family: Georgia, serif;
    background: #0e0e10;
    color: #e6e6e6;
    overflow-x: hidden;
}

/* TEXTURE */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: url('stone.png');
    opacity: 0.2;
    z-index: -1;
}

/* NAV */
.nav {
    position: fixed;
    width: 100%;
    top: 0;
    z-index: 20;
    backdrop-filter: blur(10px);
    background: rgba(10,10,12,0.3);
}

.nav-inner {
    max-width: 1100px;
    margin: auto;
    padding: 20px;
    display: flex;
    justify-content: flex-end;
}

.nav a {
    margin-left: 26px;
    font-size: 12px;
    letter-spacing: 2px;
    opacity: 0.7;
}
.nav a:hover { opacity: 1; }

/* HERO */
.header {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
}

.header-overlay {
    position: absolute;
    inset: 0;
    background:
        linear-gradient(rgba(10,10,12,0.85), rgba(10,10,12,0.95)),
        url('forest.png');
    background-size: cover;
    background-position: center;
}

.header-inner {
    z-index: 2;
    text-align: center;
}

.header h1 {
    font-size: clamp(50px, 8vw, 110px);
    margin-bottom: 20px;
}

.header p {
    opacity: 0.7;
}

/* FEATURED */
.section {
    padding: 160px 20px;
}

.container {
    max-width: 1100px;
    margin: auto;
}

.featured-main {
    display: grid;
    grid-template-columns: 420px 1fr;
    gap: 100px;
    align-items: center;
}

.featured-main img {
    width: 100%;
    box-shadow: 0 80px 160px rgba(0,0,0,0.9);
}

/* LN BOOK STACK */
.book-scroll {
    height: 400vh;
    position: relative;
}

.book-stack {
    position: sticky;
    top: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
}

.stack-img {
    position: absolute;
    width: 280px;
    opacity: 0;
    transform: scale(0.9) translateY(80px);
    box-shadow: 0 60px 120px rgba(0,0,0,0.6);
}

/* FOOTER */
.footer {
    padding: 60px;
    border-top: 1px solid #333;
}

</style>
</head>

<body>

<!-- NAV -->
<div class="nav">
    <div class="nav-inner">
        <a href="#">Home</a>
        <a href="#">Publications</a>
        <a href="#">About</a>
        <a href="#">Author</a>
        <a href="#">Contact</a>
    </div>
</div>

<!-- HERO -->
<div class="header">
    <div class="header-overlay"></div>
    <div class="header-inner">
        <h1>Blackwood Publishing</h1>
        <p>Literary and psychological fiction shaped by place and memory.</p>
    </div>
</div>

<!-- FEATURED -->
<div class="section">
<div class="container featured-main">

    <img src="book2.jpg" class="parallax">

    <div>
        <h2>Corrour Bothy</h2>
        <p>Some shelters protect. Others keep you.</p>
    </div>

</div>
</div>

<!-- LN STYLE SCROLL -->
<div class="book-scroll">

    <div class="book-stack">
        <img src="book3.jpg" class="stack-img">
        <img src="book1.jpg" class="stack-img">
        <img src="book4.jpg" class="stack-img">
        <img src="book5.jpg" class="stack-img">
        <img src="book6.jpg" class="stack-img">
    </div>

</div>

<!-- FOOTER -->
<div class="footer">
© Blackwood Publishing
</div>

<script>

gsap.registerPlugin(ScrollTrigger);

/* STACKED REVEAL */
const images = gsap.utils.toArray(".stack-img");

images.forEach((img, i) => {

    gsap.to(img, {
        opacity: 1,
        scale: 1,
        y: 0,
        scrollTrigger: {
            trigger: ".book-scroll",
            start: () => "top -" + (window.innerHeight * i),
            end: () => "top -" + (window.innerHeight * (i + 1)),
            scrub: true
        }
    });

    if (i !== images.length - 1) {
        gsap.to(img, {
            opacity: 0,
            scale: 0.95,
            scrollTrigger: {
                trigger: ".book-scroll",
                start: () => "top -" + (window.innerHeight * (i + 0.5)),
                end: () => "top -" + (window.innerHeight * (i + 1)),
                scrub: true
            }
        });
    }

});

/* MOUSE FLOAT EFFECT */
document.addEventListener("mousemove", e => {

    const x = (e.clientX / window.innerWidth - 0.5) * 40;
    const y = (e.clientY / window.innerHeight - 0.5) * 40;

    gsap.to(".stack-img", {
        x: x,
        y: y,
        duration: 0.6,
        ease: "power2.out"
    });

});

/* PARALLAX FEATURED IMAGE */
gsap.to(".parallax", {
    y: -80,
    scrollTrigger: {
        trigger: ".parallax",
        scrub: true
    }
});

</script>

</body>
</html>
