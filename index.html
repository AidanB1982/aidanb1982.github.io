<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blackwood Publishing</title>

<!-- MAIN CSS -->
<link rel="stylesheet" href="css/style.css">

<style>
body {
    margin: 0;
    background: #0f0f11;
    font-family: Georgia, serif;
    color: #e6e6e6;
}
</style>

</head>

<body>

<!-- =========================
     HEADER LOAD POINT
========================= -->
<div id="header-placeholder"></div>

<!-- =========================
     LOAD HEADER
========================= -->
<script>
fetch('header.html')
    .then(res => {
        if (!res.ok) {
            throw new Error("Header failed to load");
        }
        return res.text();
    })
    .then(data => {
        document.getElementById('header-placeholder').innerHTML = data;

        // Load header JS AFTER HTML is injected
        const script = document.createElement('script');
        script.src = 'js/header.js';   // ✅ FIXED PATH
        document.body.appendChild(script);
    })
    .catch(err => {
        console.error(err);
    });
</script>

</body>
</html>
