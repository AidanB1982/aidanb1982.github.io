<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blackwood Publishing</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://unpkg.com/@studio-freight/lenis"></script>

<style>
body{margin:0;font-family:Georgia,serif;background:#0e0e10;color:#eee;overflow-x:hidden}
.hero{height:50vh;display:flex;align-items:center;justify-content:center;text-align:center;background:url('forest.png') center/cover}
.section{padding:100px 20px;background:#0b0b0c}
.container{max-width:1100px;margin:auto}

.book-wall{display:grid;grid-template-columns:repeat(4,1fr);gap:30px}
.column{display:flex;flex-direction:column;gap:40px}
.offset-1{transform:translateY(40px)}
.offset-2{transform:translateY(80px)}
.offset-3{transform:translateY(120px)}

.book-wrap{position:relative;perspective:800px}
.book-wrap::before{
content:"";position:absolute;inset:-10px;
background:radial-gradient(circle,rgba(255,255,255,0.08),transparent 70%);
opacity:0;transition:.4s
}
.book-wrap:hover::before{opacity:1}

.book-item{
width:100%;opacity:0;
transform:translateY(80px) scale(.95) rotateX(0) rotateY(0);
box-shadow:0 30px 80px rgba(0,0,0,.7);
transition:transform .2s ease
}

@media(max-width:900px){.book-wall{grid-template-columns:1fr}}
</style>
</head>

<body>

<div class="hero">
<div>
<img src="logo (1).png" width="160">
<p>Literary and psychological fiction shaped by place, memory, and unease.</p>
</div>
</div>

<div class="section">
<div class="container">

<h2 style="text-align:center;">Current Publications</h2>

<div class="book-wall" id="wall">
<div class="column"></div>
<div class="column offset-1"></div>
<div class="column offset-2"></div>
<div class="column offset-3"></div>
</div>

</div>
</div>

<script>
/* LENIS */
const lenis=new Lenis({lerp:.08});
requestAnimationFrame(function raf(t){lenis.raf(t);requestAnimationFrame(raf)});

/* GSAP */
gsap.registerPlugin(ScrollTrigger);

/* BOOKS (NO book12) */
const books=[
"book1.jpg","book2.jpg","book3.jpg","book4.jpg",
"book5.jpg","book6.jpg","book7.png","book8.jpg",
"book9.png","book10.jpg","book11.png","book13.jpg"
];

/* SHUFFLE */
books.sort(()=>Math.random()-.5);

/* BUILD GRID */
const cols=document.querySelectorAll(".column");

books.forEach((src,i)=>{
let wrap=document.createElement("div");
wrap.className="book-wrap";

let img=document.createElement("img");
img.src=src;
img.className="book-item";

wrap.appendChild(img);
cols[i%4].appendChild(wrap);
});

/* REVEAL */
document.querySelectorAll(".column").forEach(col=>{
gsap.to(col.children,{
scrollTrigger:{trigger:col,start:"top 85%"},
opacity:1,y:0,stagger:.12,duration:1.2,ease:"power3.out"
});
});

/* FLOAT */
document.querySelectorAll(".book-wrap").forEach((el,i)=>{
gsap.to(el,{
y:"random(-12,12)",
duration:"random(2,4)",
repeat:-1,yoyo:true,ease:"sine.inOut",delay:i*.1
});
});

/* PARALLAX */
[".offset-1",".offset-2",".offset-3"].forEach((cls,i)=>{
gsap.to(cls,{
y:(i+1)*120,
scrollTrigger:{scrub:true}
});
});

/* 3D TILT */
document.querySelectorAll(".book-wrap").forEach(wrap=>{
wrap.addEventListener("mousemove",e=>{
const rect=wrap.getBoundingClientRect();
const x=(e.clientX-rect.left)/rect.width-.5;
const y=(e.clientY-rect.top)/rect.height-.5;

wrap.querySelector("img").style.transform=
`rotateY(${x*15}deg) rotateX(${y*-15}deg) scale(1.05)`;
});

wrap.addEventListener("mouseleave",()=>{
wrap.querySelector("img").style.transform=
"rotateY(0) rotateX(0) scale(1)";
});
});
</script>

</body>
</html>
