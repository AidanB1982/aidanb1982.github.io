<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

/* =========================
   BASE
========================= */
body {
    margin: 0;
    background: #0f0f11;
    font-family: Georgia, serif;
    color: #e6e6e6;
}

/* =========================
   HERO
========================= */
.hero {
    position: relative;
    height: 100vh;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
}

/* BACKGROUND + DAY/NIGHT + TREE SHIFT */
.hero::before {
    content: "";
    position: absolute;
    inset: 0;

    background:
        linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.75)),
        url('forest.png') center/cover no-repeat;

    animation:
        dayNightCycle 40s ease-in-out infinite alternate,
        treeShift 20s ease-in-out infinite alternate;
}

/* VIGNETTE + COLOR SHIFT */
.hero::after {
    content: "";
    position: absolute;
    inset: 0;

    background:
        radial-gradient(circle, transparent 40%, rgba(0,0,0,0.7)),
        linear-gradient(to bottom, rgba(20,30,60,0.2), rgba(0,0,0,0.4));

    mix-blend-mode: multiply;

    animation: colorShift 40s ease-in-out infinite alternate;
}

/* =========================
   FOG (DEPTH)
========================= */
.fog-back,
.fog-mid,
.fog-front {
    position: absolute;
    inset: 0;
    background: url('fog.png');
    background-repeat: repeat-x;
    background-size: cover;

    mask-image: linear-gradient(to right, transparent, black 20%, black 80%, transparent);
    pointer-events: none;

    will-change: transform;
    filter: blur(2px);
}

.fog-back { opacity: 0.04; animation: fogSlow 180s linear infinite; }
.fog-mid  { opacity: 0.07; animation: fogMid 120s linear infinite; }
.fog-front{ opacity: 0.12; animation: fogFast 60s linear infinite; }

/* =========================
   ENTITY (👁 PRESENCE)
========================= */
.shadow-entity {
    position: absolute;
    width: 300px;
    height: 300px;

    background: radial-gradient(circle, rgba(0,0,0,0.6), transparent 70%);
    filter: blur(40px);

    mix-blend-mode: multiply;

    animation:
        entityMove 18s ease-in-out infinite,
        entityFade 40s ease-in-out infinite;

    pointer-events: none;
}

/* =========================
   CONTENT
========================= */
.hero-inner {
    position: relative;
    z-index: 10;
    max-width: 600px;
    animation: fadeIn 2s ease forwards;
}

.hero-logo {
    width: 320px;
    max-width: 80%;
    margin-bottom: 20px;

    animation: logoFlicker 6s infinite;
}

.hero p {
    opacity: 0.85;
    line-height: 1.7;
    letter-spacing: 0.5px;
    text-shadow: 0 0 8px rgba(255,255,255,0.08);
}

/* NAV */
.nav-inline {
    margin: 20px 0;
}

.nav-inline a {
    margin: 0 15px;
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #e6e6e6;
    text-decoration: none;
    opacity: 0.7;
    transition: 0.3s;
}

.nav-inline a:hover {
    opacity: 1;
    text-shadow: 0 0 6px rgba(255,255,255,0.4);
}

/* BUTTON */
.button {
    display: inline-block;
    margin-top: 25px;
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    border-bottom: 1px solid rgba(255,255,255,0.4);
    padding-bottom: 4px;
    color: #e6e6e6;
    text-decoration: none;
}

/* =========================
   ANIMATIONS
========================= */

/* FOG */
@keyframes fogSlow {
    from { transform: translateX(0); }
    to { transform: translateX(-600px); }
}
@keyframes fogMid {
    from { transform: translateX(0); }
    to { transform: translateX(-800px); }
}
@keyframes fogFast {
    from { transform: translateX(0); }
    to { transform: translateX(-1200px); }
}

/* ENTITY */
@keyframes entityMove {
    0%   { transform: translate(10%, 40%); }
    50%  { transform: translate(70%, 50%); }
    100% { transform: translate(20%, 60%); }
}

@keyframes entityFade {
    0%   { opacity: 0.35; }
    50%  { opacity: 0.1; }
    100% { opacity: 0.35; }
}

/* TREE SHIFT */
@keyframes treeShift {
    0%   { transform: scale(1) translateX(0); }
    100% { transform: scale(1.02) translateX(-10px); }
}

/* LOGO */
@keyframes logoFlicker {
    0%,100%{opacity:1;}
    50%{opacity:0.85;}
}

/* FADE */
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px);}
    to { opacity: 1; transform: translateY(0);}
}

/* DAY/NIGHT */
@keyframes dayNightCycle {
    0% {
        filter: grayscale(40%) brightness(0.65) contrast(120%) saturate(80%);
    }
    50% {
        filter: grayscale(15%) brightness(0.95) contrast(100%) saturate(100%);
    }
    100% {
        filter: grayscale(40%) brightness(0.65) contrast(120%) saturate(80%);
    }
}

/* COLOR SHIFT */
@keyframes colorShift {
    0%   { opacity: 0.6; }
    50%  { opacity: 0.3; }
    100% { opacity: 0.6; }
}

</style>
</head>

<body>

<section class="hero">

    <div class="fog-back"></div>
    <div class="fog-mid"></div>
    <div class="fog-front"></div>

    <div class="shadow-entity"></div>

    <div class="hero-inner">

        <img src="logo (1).png" class="hero-logo">

        <div class="nav-inline">
            <a href="#">Home</a>
            <a href="#">Publications</a>
            <a href="#">About</a>
            <a href="#">Author</a>
            <a href="#">Contact</a>
        </div>

        <p>
        Independent publisher of literary and psychological fiction shaped by place,
        memory, and unease.
        </p>

        <a href="#" class="button">Explore Publications</a>

    </div>

</section>

<script>

/* PARALLAX LIGHT */
const hero = document.querySelector('.hero');

let targetX = 50, targetY = 50;
let currentX = 50, currentY = 50;

hero.addEventListener('mousemove', e => {
    const rect = hero.getBoundingClientRect();
    targetX = ((e.clientX - rect.left) / rect.width) * 100;
    targetY = ((e.clientY - rect.top) / rect.height) * 100;
});

function animate() {
    currentX += (targetX - currentX) * 0.05;
    currentY += (targetY - currentY) * 0.05;

    hero.style.setProperty('--mx', currentX + '%');
    hero.style.setProperty('--my', currentY + '%');

    requestAnimationFrame(animate);
}
animate();

</script>

</body>
</html>
