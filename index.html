<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blackwood Publishing</title>

<!-- GSAP -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

<!-- LENIS -->
<script src="https://unpkg.com/@studio-freight/lenis"></script>

<style>

/* ================= BASE ================= */
body {
    margin: 0;
    font-family: Georgia, serif;
    background: #0e0e10;
    color: #e6e6e6;
    overflow-x: hidden;
}

/* ================= HERO ================= */
.hero {
    height: 50vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    background: url('forest.png') center/cover;
}

/* ================= SECTION ================= */
.section.dark {
    background: #0b0b0c;
    padding: 100px 20px;
}

.container {
    max-width: 1100px;
    margin: auto;
}

/* ================= BOOK WALL ================= */
.book-wall {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 30px;
}

.column {
    display: flex;
    flex-direction: column;
    gap: 40px;
}

.offset-1 { transform: translateY(40px); }
.offset-2 { transform: translateY(80px); }
.offset-3 { transform: translateY(120px); }

/* BOOK WRAPPER (for glow) */
.book-wrap {
    position: relative;
}

/* GLOW */
.book-wrap::before {
    content: "";
    position: absolute;
    inset: -10px;
    background: radial-gradient(circle, rgba(255,255,255,0.08), transparent 70%);
    opacity: 0;
    transition: opacity 0.5s ease;
}

.book-wrap:hover::before {
    opacity: 1;
}

/* BOOK */
.book-item {
    opacity: 0;
    transform: translateY(80px) scale(0.95);
    box-shadow: 0 30px 80px rgba(0,0,0,0.7);
    transition: transform 0.4s ease;
}

.book-item:hover {
    transform: translateY(-10px) scale(1.05);
}

/* ================= MOBILE ================= */
@media (max-width: 900px) {
    .book-wall { grid-template-columns: 1fr; }
}

</style>
</head>

<body>

<div class="hero">
    <div>
        <img src="logo (1).png" width="160">
        <p>Literary and psychological fiction shaped by place, memory, and unease.</p>
    </div>
</div>

<div class="section dark">
<div class="container">

<h2 style="text-align:center;">Current Publications</h2>

<div class="book-wall" id="bookWall">

    <div class="column"></div>
    <div class="column offset-1"></div>
    <div class="column offset-2"></div>
    <div class="column offset-3"></div>

</div>

</div>
</div>

<script>

/* ================= LENIS ================= */
const lenis = new Lenis({ lerp: 0.08 });
function raf(time) {
    lenis.raf(time);
    requestAnimationFrame(raf);
}
requestAnimationFrame(raf);

/* ================= GSAP ================= */
gsap.registerPlugin(ScrollTrigger);

/* ================= BOOK DATA ================= */
const books = [
    "book1.jpg","book2.jpg","book3.jpg","book4.jpg",
    "book5.jpg","book6.jpg","book7.png","book8.jpg",
    "book9.png","book10.jpg","book11.png","book13.jpg"
];

/* SHUFFLE */
function shuffle(array) {
    return array.sort(() => Math.random() - 0.5);
}

const shuffled = shuffle([...books]);

/* DISTRIBUTE INTO COLUMNS */
const columns = document.querySelectorAll(".column");

shuffled.forEach((src, i) => {
    const wrap = document.createElement("div");
    wrap.classList.add("book-wrap");

    const img = document.createElement("img");
    img.src = src;
    img.classList.add("book-item");

    wrap.appendChild(img);

    columns[i % 4].appendChild(wrap);
});

/* STAGGER REVEAL */
document.querySelectorAll(".column").forEach(col => {
    gsap.to(col.querySelectorAll(".book-item"), {
        scrollTrigger: {
            trigger: col,
            start: "top 85%"
        },
        opacity: 1,
        y: 0,
        stagger: 0.12,
        duration: 1.2,
        ease: "power3.out"
    });
});

/* FLOATING MOTION */
document.querySelectorAll(".book-wrap").forEach((el, i) => {
    gsap.to(el, {
        y: "random(-10, 10)",
        duration: "random(2,4)",
        repeat: -1,
        yoyo: true,
        ease: "sine.inOut",
        delay: i * 0.1
    });
});

/* PARALLAX */
gsap.utils.toArray(".offset-1").forEach(el => {
    gsap.to(el, { y: 140, scrollTrigger: { scrub: true } });
});
gsap.utils.toArray(".offset-2").forEach(el => {
    gsap.to(el, { y: 200, scrollTrigger: { scrub: true } });
});
gsap.utils.toArray(".offset-3").forEach(el => {
    gsap.to(el, { y: 260, scrollTrigger: { scrub: true } });
});

</script>

</body>
</html>
