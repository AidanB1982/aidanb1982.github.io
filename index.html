<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blackwood Publishing</title>

<!-- GSAP -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

<!-- LENIS -->
<script src="https://unpkg.com/@studio-freight/lenis"></script>

<style>

/* ================= BASE ================= */
body {
    margin: 0;
    font-family: Georgia, serif;
    background: #0e0e10;
    color: #e6e6e6;
    overflow-x: hidden;
    cursor: none;
}

/* CUSTOM CURSOR */
.cursor {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #fff;
    position: fixed;
    pointer-events: none;
    z-index: 9999;
    transform: translate(-50%, -50%);
    transition: transform 0.15s ease, opacity 0.3s;
}

.cursor-grow {
    transform: translate(-50%, -50%) scale(2.5);
    opacity: 0.6;
}

/* TEXTURE */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: url('stone.png');
    opacity: 0.12;
    z-index: -1;
}

/* ================= NAV ================= */
.nav {
    position: absolute;
    top: 25px;
    right: 50px;
    z-index: 10;
}

.nav a {
    margin-left: 20px;
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
}

/* ================= HERO ================= */
.hero {
    height: 50vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    position: relative;
}

.hero::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
        linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.9)),
        url('forest.png');
    background-size: cover;
}

.hero-inner {
    position: relative;
    z-index: 2;
    opacity: 0;
}

/* ================= SECTION ================= */
.section {
    padding: 90px 20px;
    background: rgba(232,230,225,0.9);
    color: #1c1c1c;
}

.section.dark {
    background: #0b0b0c;
    color: #ddd;
}

.container {
    max-width: 1100px;
    margin: auto;
}

/* ================= BOOK WALL ================= */
.book-wall {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 30px;
}

.column {
    display: flex;
    flex-direction: column;
    gap: 40px;
}

.offset-1 { transform: translateY(40px); }
.offset-2 { transform: translateY(80px); }
.offset-3 { transform: translateY(120px); }

.book-item {
    opacity: 0;
    transform: translateY(80px) scale(0.95);
    box-shadow: 0 30px 80px rgba(0,0,0,0.7);
    transition: transform 0.4s ease;
}

/* HOVER GLOW */
.book-item:hover {
    transform: translateY(-8px) scale(1.04);
    box-shadow: 0 40px 120px rgba(0,0,0,0.9);
}

/* ================= FOOTER ================= */
.footer {
    padding: 80px 20px;
    background: #000;
}

.footer-content {
    max-width: 1000px;
    margin: auto;
    display: flex;
    justify-content: space-between;
}

.socials {
    display: flex;
    gap: 15px;
    margin-top: 10px;
}

.socials img {
    width: 22px;
    opacity: 0.7;
    transition: 0.3s;
}

.socials img:hover {
    opacity: 1;
    transform: scale(1.1);
}

/* ================= MOBILE ================= */
@media (max-width: 900px) {
    .book-wall { grid-template-columns: 1fr; }
    body { cursor: default; }
    .cursor { display: none; }
}

</style>
</head>

<body>

<div class="cursor"></div>

<!-- NAV -->
<div class="nav">
<a href="#">Home</a>
<a href="#">Publications</a>
<a href="#">About</a>
</div>

<!-- HERO -->
<div class="hero">
<div class="hero-inner">
<img src="logo (1).png" width="170">
<p>Literary and psychological fiction shaped by place, memory, and unease.</p>
</div>
</div>

<!-- BOOK WALL -->
<div class="section dark">
<div class="container">

<h2 style="text-align:center;">Current Publications</h2>

<div class="book-wall">

<div class="column">
<img src="book1.jpg" class="book-item">
<img src="book5.jpg" class="book-item">
<img src="book9.png" class="book-item">
</div>

<div class="column offset-1">
<img src="book2.jpg" class="book-item">
<img src="book6.jpg" class="book-item">
<img src="book10.jpg" class="book-item">
</div>

<div class="column offset-2">
<img src="book3.jpg" class="book-item">
<img src="book7.png" class="book-item">
<img src="book11.png" class="book-item">
</div>

<div class="column offset-3">
<img src="book4.jpg" class="book-item">
<img src="book8.jpg" class="book-item">
<img src="book13.jpg" class="book-item">
</div>

</div>
</div>
</div>

<!-- FOOTER -->
<div class="footer">
<div class="footer-content">

<div>
<p>Blackwood Publishing</p>
<div class="socials">
<a href="https://www.instagram.com/aidan.blackwood" target="_blank">
<img src="instagram.png">
</a>
<a href="https://www.tiktok.com/@aidanblackwood" target="_blank">
<img src="tiktok.png">
</a>
</div>
</div>

<div>
<img src="seal.png" width="60">
</div>

<div>
<a href="#">Publications</a><br>
<a href="#">About</a>
</div>

</div>
</div>

<script>

/* ================= LENIS ================= */
const lenis = new Lenis({ lerp: 0.08 });

function raf(time) {
    lenis.raf(time);
    requestAnimationFrame(raf);
}
requestAnimationFrame(raf);

/* ================= GSAP ================= */
gsap.registerPlugin(ScrollTrigger);

/* HERO INTRO */
gsap.to(".hero-inner", {
    opacity: 1,
    y: 0,
    duration: 1.5,
    ease: "power3.out"
});

/* BOOK STAGGER */
document.querySelectorAll(".column").forEach(col => {
    gsap.to(col.querySelectorAll(".book-item"), {
        scrollTrigger: {
            trigger: col,
            start: "top 85%"
        },
        opacity: 1,
        y: 0,
        stagger: 0.15,
        duration: 1.2,
        ease: "power3.out"
    });
});

/* PARALLAX */
gsap.utils.toArray(".offset-1").forEach(el => {
    gsap.to(el, {
        y: 140,
        scrollTrigger: { scrub: true }
    });
});

gsap.utils.toArray(".offset-2").forEach(el => {
    gsap.to(el, {
        y: 200,
        scrollTrigger: { scrub: true }
    });
});

gsap.utils.toArray(".offset-3").forEach(el => {
    gsap.to(el, {
        y: 260,
        scrollTrigger: { scrub: true }
    });
});

/* ================= CUSTOM CURSOR ================= */
const cursor = document.querySelector(".cursor");

window.addEventListener("mousemove", e => {
    cursor.style.left = e.clientX + "px";
    cursor.style.top = e.clientY + "px";
});

document.querySelectorAll("a, .book-item").forEach(el => {
    el.addEventListener("mouseenter", () => cursor.classList.add("cursor-grow"));
    el.addEventListener("mouseleave", () => cursor.classList.remove("cursor-grow"));
});

</script>

</body>
</html>
