<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Blackwood Publishing</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

<style>

/* BASE */
body {
    margin: 0;
    background: #0e0e10;
    color: white;
    font-family: Arial, sans-serif;
    overflow-x: hidden;
}

/* SMOOTH SECTIONS */
.section {
    height: 120vh;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* HERO */
.hero {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
}

.hero h1 {
    font-size: clamp(60px, 10vw, 120px);
}

/* IMAGE STACK (LN STYLE CORE) */
.image-stack {
    position: relative;
    width: 60vw;
    height: 70vh;
}

.image-stack img {
    position: absolute;
    width: 100%;
    height: 100%;
    object-fit: cover;
    top: 0;
    left: 0;
}

/* TOP IMAGE (REVEAL MASK) */
.reveal-img {
    clip-path: inset(100% 0% 0% 0%);
}

/* MOUSE PARALLAX */
.parallax {
    transition: transform 0.2s ease-out;
}

</style>
</head>

<body>

<!-- HERO -->
<div class="hero">
    <h1>Blackwood</h1>
</div>

<!-- LN STYLE IMAGE TRANSITION -->
<div class="section">

    <div class="image-stack">

        <!-- BASE IMAGE -->
        <img src="book2.jpg" class="parallax base">

        <!-- TOP REVEAL IMAGE -->
        <img src="book3.jpg" class="reveal-img parallax top">

    </div>

</div>

<!-- SECOND TRANSITION -->
<div class="section">

    <div class="image-stack">

        <img src="book6.jpg" class="parallax base">
        <img src="book13.jpg" class="reveal-img parallax top">

    </div>

</div>

<script>

gsap.registerPlugin(ScrollTrigger);

/* IMAGE REVEAL ON SCROLL */
gsap.utils.toArray(".image-stack").forEach(stack => {

    let topImage = stack.querySelector(".top");

    gsap.to(topImage, {
        clipPath: "inset(0% 0% 0% 0%)",
        ease: "none",
        scrollTrigger: {
            trigger: stack,
            start: "top center",
            end: "bottom center",
            scrub: true
        }
    });

});

/* MOUSE PARALLAX (LN STYLE FEEL) */
document.querySelectorAll(".image-stack").forEach(stack => {

    stack.addEventListener("mousemove", e => {

        const rect = stack.getBoundingClientRect();
        const x = (e.clientX - rect.left) / rect.width - 0.5;
        const y = (e.clientY - rect.top) / rect.height - 0.5;

        stack.querySelectorAll("img").forEach((img, i) => {
            gsap.to(img, {
                x: x * 30 * (i + 1),
                y: y * 30 * (i + 1),
                duration: 0.6,
                ease: "power2.out"
            });
        });

    });

});

/* RESET POSITION ON LEAVE */
document.querySelectorAll(".image-stack").forEach(stack => {

    stack.addEventListener("mouseleave", () => {
        stack.querySelectorAll("img").forEach(img => {
            gsap.to(img, {
                x: 0,
                y: 0,
                duration: 0.8
            });
        });
    });

});

</script>

</body>
</html>
