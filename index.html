<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blackwood Publishing</title>

<!-- GSAP -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

<style>

/* BASE */
body {
    margin: 0;
    font-family: Georgia, serif;
    background: #0e0e10;
    color: #e6e6e6;
    overflow-x: hidden;
}

/* TEXTURE */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: url('stone.png');
    opacity: 0.2;
    z-index: -1;
}

/* NAV */
.nav {
    position: fixed;
    width: 100%;
    top: 0;
    z-index: 20;
    backdrop-filter: blur(12px);
    background: rgba(10,10,12,0.3);
}

.nav-inner {
    max-width: 1100px;
    margin: auto;
    padding: 20px;
    display: flex;
    justify-content: flex-end;
}

.nav a {
    margin-left: 30px;
    font-size: 12px;
    letter-spacing: 2px;
    opacity: 0.7;
}

.nav a:hover { opacity: 1; }

/* HERO */
.header {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    position: relative;
}

.header-overlay {
    position: absolute;
    inset: 0;
    background:
        linear-gradient(rgba(10,10,12,0.85), rgba(10,10,12,0.95)),
        url('forest.png');
    background-size: cover;
    background-position: center;
}

/* HERO CONTENT */
.header-inner {
    z-index: 2;
    max-width: 700px;
}

.header h1 {
    font-size: clamp(50px, 8vw, 110px);
    letter-spacing: -2px;
    margin-bottom: 20px;
    overflow: hidden;
}

.header p {
    font-size: 18px;
    opacity: 0.7;
}

/* SECTIONS */
.section {
    padding: 160px 20px;
}

.container {
    max-width: 1100px;
    margin: auto;
}

/* FEATURED */
.featured-main {
    display: grid;
    grid-template-columns: 420px 1fr;
    gap: 100px;
    align-items: center;
}

.featured-main img {
    width: 100%;
    transform: perspective(1200px) rotateY(-8deg);
    box-shadow: 0 80px 160px rgba(0,0,0,0.9);
}

/* SECONDARY */
.featured-secondary {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 80px;
    margin-top: 120px;
}

/* BOOK */
.book img {
    width: 240px;
}

/* TEXT */
h2 {
    font-size: clamp(28px, 4vw, 52px);
}

.link {
    margin-top: 20px;
    display: inline-block;
    position: relative;
}

.link::after {
    content: "";
    position: absolute;
    height: 1px;
    width: 100%;
    bottom: -4px;
    left: 0;
    background: white;
    transform: scaleX(0);
    transform-origin: left;
    transition: 0.4s;
}

.link:hover::after {
    transform: scaleX(1);
}

/* LIGHT SECTION */
.texture {
    background: #E8E6E1;
    color: #111;
}

/* FOOTER */
.footer {
    padding: 60px;
    border-top: 1px solid #333;
}

/* MOBILE */
@media (max-width: 900px) {
    .featured-main,
    .featured-secondary {
        grid-template-columns: 1fr;
    }
}

</style>
</head>

<body>

<!-- NAV -->
<div class="nav">
    <div class="nav-inner">
        <a href="#">Home</a>
        <a href="#">Publications</a>
        <a href="#">About</a>
        <a href="#">Author</a>
        <a href="#">Contact</a>
    </div>
</div>

<!-- HERO -->
<div class="header">
    <div class="header-overlay"></div>

    <div class="header-inner">
        <h1 class="hero-title">Blackwood Publishing</h1>
        <p>Independent publisher of literary psychological fiction.</p>
    </div>
</div>

<!-- FEATURED -->
<div class="section">
<div class="container featured-main">

    <img src="book2.jpg" class="parallax">

    <div>
        <h2 class="reveal-text">Corrour Bothy</h2>
        <p>Some shelters protect. Others keep you.</p>
        <a href="#" class="link">Purchase</a>
    </div>

</div>

<div class="container featured-secondary">

    <div>
        <img src="book6.jpg" class="parallax">
        <h3>Holdfast</h3>
    </div>

    <div>
        <img src="book13.jpg" class="parallax">
        <h3>Corrour Bothy</h3>
    </div>

</div>
</div>

<!-- LIGHT SECTION -->
<div class="section texture">
<div class="container">
<h2>Popular Reads</h2>
</div>
</div>

<!-- FOOTER -->
<div class="footer">
© Blackwood Publishing
</div>

<!-- SMOOTH SCROLL -->
<script src="https://unpkg.com/lenis@1.0.0/dist/lenis.min.js"></script>
<script>
const lenis = new Lenis({ lerp: 0.08 });
function raf(time) {
    lenis.raf(time);
    requestAnimationFrame(raf);
}
requestAnimationFrame(raf);
</script>

<!-- GSAP ANIMATIONS -->
<script>

gsap.registerPlugin(ScrollTrigger);

/* HERO TEXT REVEAL */
gsap.from(".hero-title", {
    y: 120,
    opacity: 0,
    duration: 1.4,
    ease: "power4.out"
});

/* SECTION FADE INS */
gsap.utils.toArray(".featured-main, .featured-secondary").forEach(section => {
    gsap.from(section, {
        scrollTrigger: {
            trigger: section,
            start: "top 80%"
        },
        y: 80,
        opacity: 0,
        duration: 1.2
    });
});

/* PARALLAX IMAGES */
gsap.utils.toArray(".parallax").forEach(img => {
    gsap.to(img, {
        y: -60,
        scrollTrigger: {
            trigger: img,
            scrub: true
        }
    });
});

/* TEXT STAGGER (HEADINGS) */
gsap.from(".reveal-text", {
    scrollTrigger: {
        trigger: ".reveal-text",
        start: "top 85%"
    },
    y: 50,
    opacity: 0,
    duration: 1,
    stagger: 0.1
});

</script>

</body>
</html>
