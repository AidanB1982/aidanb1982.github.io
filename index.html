<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blackwood Publishing</title>

<style>

/* BASE */
body {
    margin: 0;
    font-family: Georgia, serif;
    background: #111;
    color: #e6e6e6;
}

/* HERO */
.hero {
    height: 90vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
        linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.9)),
        url('forest.png') center/cover;
}

.hero img { width: 200px; }

/* BOOK STRIP */
.books {
    padding: 80px 0;
    overflow: hidden;
}

.book-row {
    display: flex;
    gap: 40px;
}

.book img {
    width: 160px;
    cursor: pointer;
    transition: 0.3s;
}

.book img:hover {
    transform: scale(1.05);
}

/* MODAL */
.modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: 0.4s;
}

.modal.active {
    opacity: 1;
    pointer-events: all;
}

.modal-content {
    background: #111;
    padding: 40px;
    max-width: 500px;
    text-align: center;
    border: 1px solid rgba(255,255,255,0.1);
}

.modal img {
    width: 180px;
    margin-bottom: 20px;
}

.modal a {
    display: inline-block;
    margin-top: 15px;
    border-bottom: 1px solid rgba(255,255,255,0.4);
}

.close {
    position: absolute;
    top: 30px;
    right: 40px;
    font-size: 20px;
    cursor: pointer;
}

</style>
</head>

<body>

<!-- HERO -->
<div class="hero">
<img src="logo (1).png">
</div>

<!-- BOOK STRIP -->
<div class="books">
<div class="book-row">

<div class="book"><img src="A3.png" data-id="A3"></div>
<div class="book"><img src="A12.png" data-id="A12"></div>
<div class="book"><img src="A6.png" data-id="A6"></div>
<div class="book"><img src="A7.png" data-id="A7"></div>
<div class="book"><img src="A4.png" data-id="A4"></div>
<div class="book"><img src="A9.png" data-id="A9"></div>
<div class="book"><img src="A5.png" data-id="A5"></div>
<div class="book"><img src="A11.png" data-id="A11"></div>
<div class="book"><img src="A2.png" data-id="A2"></div>
<div class="book"><img src="A8.png" data-id="A8"></div>
<div class="book"><img src="A1.png" data-id="A1"></div>

</div>
</div>

<!-- MODAL -->
<div class="modal" id="modal">
<div class="close" id="close">✕</div>
<div class="modal-content">
<img id="modalImg">
<h2 id="modalTitle"></h2>
<p id="modalDesc"></p>
<a id="modalLink" target="_blank">View / Buy →</a>
</div>
</div>

<script>

/* BOOK DATA */
const books = {
A3: {
title: "Camban Bothy",
desc: "The Third Calling (The Cursed Bothies Book 3) PREORDER",
link: "https://mybook.to/Camban"
},
A12: {
title: "Dour Hill House",
desc: "A Psychological Gothic Horror Set in the Scottish Highlands",
link: "https://mybook.to/DourHillHouse"
},
A6: {
title: "The Erased Archivist",
desc: "They control the past. He's about to rewrite the future.",
link: "https://mybook.to/ErasedArchivist"
},
A7: {
title: "The Drowned Fjord",
desc: "Ancient sea myths and haunted science.",
link: "https://mybook.to/DrownedFjord"
},
A4: {
title: "Gualachulain Bothy",
desc: "A Highland Horror of grief and survival.",
link: "https://mybook.to/Gualachulain"
},
A9: {
title: "Corrour Bothy",
desc: "A haunted bothy horror novel.",
link: "https://mybook.to/Corrour"
},
A5: {
title: "Holdfast",
desc: "A haunting novel of memory and voices. PREORDER",
link: "https://mybook.to/Holdfast"
},
A11: {
title: "Red Streets",
desc: "A gritty Scottish crime thriller.",
link: "https://mybook.to/RedStreets"
},
A2: {
title: "Echoes of Vengeance",
desc: "A dark psychological revenge thriller.",
link: "https://mybook.to/echoesofvengeance"
},
A8: {
title: "The Black Bothy",
desc: "A chilling folk horror novel.",
link: "https://mybook.to/BlackBothy"
},
A1: {
title: "Corrour Bothy Limited Edition",
desc: "Founders print edition.",
link: "https://pay.tide.co/products/corrour-bot-5KdqBmDa/landing"
}
};

/* MODAL LOGIC */
const modal = document.getElementById("modal");

document.querySelectorAll(".book img").forEach(img => {
img.addEventListener("click", () => {
const id = img.dataset.id;
const data = books[id];

document.getElementById("modalImg").src = img.src;
document.getElementById("modalTitle").innerText = data.title;
document.getElementById("modalDesc").innerText = data.desc;
document.getElementById("modalLink").href = data.link;

modal.classList.add("active");
});
});

document.getElementById("close").onclick = () => {
modal.classList.remove("active");
};

modal.onclick = (e) => {
if(e.target === modal) modal.classList.remove("active");
};

</script>

</body>
</html>
