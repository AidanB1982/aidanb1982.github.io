<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blackwood Publishing</title>

<style>

/* ================= BASE ================= */
body {
    margin: 0;
    font-family: Georgia, serif;
    background: #0e0e10;
    color: #e6e6e6;
    overflow-x: hidden;
}

/* TEXTURE */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: url('stone.png');
    opacity: 0.12;
    z-index: -1;
}

/* ================= HEADER ================= */
.header {
    position: relative;
    height: 55vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
}

.nav {
    position: absolute;
    top: 0;
    width: 100%;
    background: linear-gradient(rgba(10,10,12,0.9), transparent);
}

.nav-inner {
    max-width: 1100px;
    margin: auto;
    padding: 18px 20px;
    display: flex;
    justify-content: flex-end;
}

.nav a {
    margin-left: 26px;
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    opacity: 0.75;
}

/* FOREST */
.header::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
        linear-gradient(rgba(22,22,25,0.75), rgba(22,22,25,0.9)),
        url('forest.png') center/cover;
}

/* FOG */
.header::after {
    content: "";
    position: absolute;
    inset: 0;
    background: fog.png;
    opacity: 0.25;
    animation: fog 60s linear infinite;
}

@keyframes fog {
    from { transform: translateX(0); }
    to { transform: translateX(-200px); }
}

.header-inner {
    position: relative;
    z-index: 5;
}

.header-logo {
    width: 150px;
}

/* ================= FEATURED ================= */
.featured {
    padding: 100px 20px;
    text-align: center;
}

.featured img {
    width: 360px;
    filter: drop-shadow(0 60px 140px rgba(0,0,0,0.9));
    transition: 0.4s;
}

.featured img:hover {
    transform: rotateY(-8deg) rotateX(4deg) scale(1.05);
}

/* ================= BOOK STRIP ================= */
.books {
    padding: 60px 0 100px;
    overflow: hidden;
    cursor: grab;
}

.book-row {
    display: flex;
    gap: 40px;
    padding: 0 40px;
    transition: transform 0.3s ease;
}

.book img {
    width: 150px;
    filter: drop-shadow(0 30px 70px rgba(0,0,0,0.85));
    transition: 0.4s;
}

.book img:hover {
    transform: rotateY(-10deg) scale(1.08);
}

/* CTA */
.view-all {
    text-align: center;
    margin-top: 30px;
    font-size: 12px;
    letter-spacing: 2px;
    opacity: 0.7;
}

/* ================= SECTION ================= */
.section {
    padding: 80px 20px;
    background: #E8E6E1;
    color: #1c1c1c;
    text-align: center;
}

/* ================= FOOTER ================= */
.footer {
    padding: 80px 20px;
    background: #000;
    text-align: center;
}

.socials img {
    width: 18px;
    margin: 10px;
}

/* ================= MOBILE ================= */
@media (max-width: 800px) {
    .featured img { width: 240px; }
    .book img { width: 110px; }
}

</style>
</head>

<body>

<!-- HEADER -->
<div class="header">

<div class="nav">
<div class="nav-inner">
<a href="#">Home</a>
<a href="#">Publications</a>
<a href="#">About</a>
</div>
</div>

<div class="header-inner">
<img src="logo (1).png" class="header-logo">
<p>Literary and psychological fiction shaped by place, memory, and unease.</p>
</div>

</div>

<!-- FEATURED -->
<div class="featured">
<img src="A1.png">
<h2>Dour Hill House</h2>
<p>A place that remembers.</p>
</div>

<!-- BOOK STRIP (CURATED) -->
<div class="books" id="books">
<div class="book-row" id="row">

<div class="book"><img src="A2.png"></div>
<div class="book"><img src="A3.png"></div>
<div class="book"><img src="A4.png"></div>
<div class="book"><img src="A5.png"></div>
<div class="book"><img src="A6.png"></div>

</div>
</div>

<div class="view-all">
<a href="publications.html">View All Publications →</a>
</div>

<!-- ABOUT -->
<div class="section">
<p>
Blackwood Publishing explores atmosphere, landscape, and the quiet persistence of what remains.
</p>
</div>

<!-- FOOTER -->
<div class="footer">

<p>Blackwood Publishing</p>

<div class="socials">
<a href="https://www.instagram.com/aidan.blackwood"><img src="instagram.png"></a>
<a href="https://www.tiktok.com/@aidanblackwood"><img src="tiktok.png"></a>
</div>

</div>

<script>

/* DRAG SCROLL */
const slider = document.getElementById('books');
const row = document.getElementById('row');

let isDown = false;
let startX;
let scrollLeft = 0;

slider.addEventListener('mousedown', e => {
    isDown = true;
    startX = e.pageX;
});

slider.addEventListener('mouseleave', () => isDown = false);
slider.addEventListener('mouseup', () => isDown = false);

slider.addEventListener('mousemove', e => {
    if(!isDown) return;
    const walk = (e.pageX - startX);
    scrollLeft += walk * 0.5;
    row.style.transform = `translateX(${scrollLeft}px)`;
});

/* AUTO DRIFT */
setInterval(() => {
    scrollLeft -= 0.2;
    row.style.transform = `translateX(${scrollLeft}px)`;
}, 16);

</script>

</body>
</html>
