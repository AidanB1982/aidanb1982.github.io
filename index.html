<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blackwood Publishing</title>

<style>

/* =========================
   BASE
========================= */
body {
    margin: 0;
    background: #0f0f11;
    overflow: hidden;
    font-family: Georgia, serif;
    color: #e6e6e6;
}

/* =========================
   HERO
========================= */
.hero {
    position: relative;
    height: 100vh;
    overflow: hidden;
}

/* =========================
   BACKGROUND (PARALLAX LAYERS)
========================= */

/* FAR TREES */
.hero::before {
    content: "";
    position: absolute;
    inset: 0;

    background:
        linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.85)),
        url('forest.png') center/cover no-repeat;

    transform: scale(1.1);
    animation: slowZoom 30s ease-out forwards;

    z-index: 0;
}

/* MID DEPTH FOG */
.fog-mid {
    position: absolute;
    inset: -200px;
    background: url('fog.png') repeat;
    opacity: 0.12;

    animation: fogMid 120s linear infinite;
    filter: blur(2px);

    mask-image: radial-gradient(circle, black 60%, transparent 100%);
    z-index: 1;
}

/* FRONT FOG */
.fog-front {
    position: absolute;
    inset: -200px;
    background: url('fog.png') repeat;
    opacity: 0.18;

    animation: fogFront 70s linear infinite;
    filter: blur(4px);

    mask-image: radial-gradient(circle, black 60%, transparent 100%);
    z-index: 2;
}

/* LIGHT RAYS */
.light-rays {
    position: absolute;
    inset: 0;

    background:
        radial-gradient(circle at var(--mx,50%) var(--my,50%), rgba(255,255,255,0.15), transparent 50%),
        linear-gradient(120deg, rgba(255,255,255,0.05) 0%, transparent 40%);

    mix-blend-mode: screen;
    opacity: 0.25;
    z-index: 3;
}

/* DAY/NIGHT COLOR SHIFT */
.color-shift {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at center, rgba(255,180,120,0.05), rgba(0,0,50,0.4));
    animation: dayNight 40s ease-in-out infinite;
    z-index: 3;
}

/* GRAIN */
.grain {
    position: absolute;
    inset: 0;
    background: url('https://grainy-gradients.vercel.app/noise.svg');
    opacity: 0.08;
    z-index: 4;
}

/* =========================
   CONTENT
========================= */
.hero-inner {
    position: relative;
    z-index: 5;
    text-align: center;
    top: 50%;
    transform: translateY(-50%);
}

/* LOGO */
.hero-logo {
    width: 320px;
    opacity: 0;
    animation: fadeIn 2s forwards;
}

/* NAV */
.nav-inline {
    margin: 20px 0;
    opacity: 0;
    animation: fadeIn 2s forwards;
    animation-delay: 1s;
}

.nav-inline a {
    margin: 0 12px;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    opacity: 0.7;
}

.nav-inline a:hover {
    opacity: 1;
}

/* TEXT */
.hero p {
    opacity: 0;
    animation: fadeIn 2s forwards;
    animation-delay: 1.5s;
}

/* BUTTON */
.button {
    display: inline-block;
    margin-top: 20px;
    border-bottom: 1px solid rgba(255,255,255,0.4);
    padding-bottom: 4px;
    opacity: 0;
    animation: fadeIn 2s forwards;
    animation-delay: 2s;
}

/* =========================
   ANIMATIONS
========================= */

@keyframes fogMid {
    from { transform: translateX(0); }
    to { transform: translateX(-800px); }
}

@keyframes fogFront {
    from { transform: translateX(0); }
    to { transform: translateX(-1200px); }
}

@keyframes slowZoom {
    from { transform: scale(1.15); }
    to { transform: scale(1); }
}

@keyframes fadeIn {
    to { opacity: 1; }
}

@keyframes dayNight {
    0%   { opacity: 0.3; }
    50%  { opacity: 0.6; }
    100% { opacity: 0.3; }
}

</style>
</head>

<body>

<section class="hero">

    <div class="fog-mid"></div>
    <div class="fog-front"></div>

    <div class="light-rays"></div>
    <div class="color-shift"></div>
    <div class="grain"></div>

    <div class="hero-inner">

        <img src="logo (1).png" class="hero-logo">

        <div class="nav-inline">
            <a href="#">Home</a>
            <a href="#">Publications</a>
            <a href="#">About</a>
            <a href="#">Author</a>
            <a href="#">Contact</a>
        </div>

        <p>
        Independent publisher of literary and psychological fiction shaped by place, memory, and unease.
        </p>

        <a href="#" class="button">Explore Publications</a>

    </div>

</section>

<script>

/* =========================
   LIGHT FOLLOW + CAMERA DRIFT
========================= */

const hero = document.querySelector('.hero');

let targetX = 50, targetY = 50;
let currentX = 50, currentY = 50;

/* mouse influence */
hero.addEventListener('mousemove', e => {
    const rect = hero.getBoundingClientRect();

    targetX = ((e.clientX - rect.left) / rect.width) * 100;
    targetY = ((e.clientY - rect.top) / rect.height) * 100;
});

/* idle cinematic drift */
let t = 0;

function animate() {

    t += 0.002;

    const driftX = Math.sin(t) * 5;
    const driftY = Math.cos(t) * 5;

    currentX += ((targetX + driftX) - currentX) * 0.05;
    currentY += ((targetY + driftY) - currentY) * 0.05;

    hero.style.setProperty('--mx', currentX + '%');
    hero.style.setProperty('--my', currentY + '%');

    requestAnimationFrame(animate);
}

animate();

</script>

</body>
</html>
