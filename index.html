<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blackwood Publishing</title>

<style>

/* BASE */
body {
    margin: 0;
    font-family: Georgia, serif;
    background: #0e0e10;
    color: #e6e6e6;
}

/* BACKGROUND TEXTURE */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: url('stone.png');
    opacity: 0.30;
    z-index: -1;
}

/* LINKS */
a, a:visited, a:active {
    color: inherit;
    text-decoration: none;
}

/* =========================
   HEADER
========================= */
.header {
    position: relative;
    height: 35vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
}

/* NAV */
.nav {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    z-index: 10;

    background: linear-gradient(
        rgba(10,10,12,0.9),
        rgba(10,10,12,0.5),
        transparent
    );
}

.nav-inner {
    max-width: 1100px;
    margin: 0 auto;
    padding: 18px 20px;
    display: flex;
    justify-content: flex-end;
}

.nav a {
    margin-left: 26px;
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    opacity: 0.75;
    position: relative;
}

.nav a:hover {
    opacity: 1;
}

.nav a::after {
    content: "";
    position: absolute;
    bottom: -4px;
    left: 0;
    width: 0;
    height: 1px;
    background: #aaa;
    transition: 0.3s;
}

.nav a:hover::after {
    width: 100%;
}

/* HEADER BACKGROUND */
.header-overlay {
    position: absolute;
    inset: 0;
    background:
        linear-gradient(rgba(22,22,25,0.85), rgba(22,22,25,0.85)),
        url('forest.png');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
}

/* 🌫️ REAL FOG LAYER (your fog.png) */
.header-fog {
    position: absolute;
    inset: 0;
    z-index: 2;
    pointer-events: none;

    background: url('fog.png');
    background-size: cover;
    background-repeat: no-repeat;
    opacity: 0.18;

    animation: fogDrift 90s linear infinite;
}

@keyframes fogDrift {
    0%   { transform: translateX(-10%) scale(1.1); }
    50%  { transform: translateX(10%) scale(1.2); }
    100% { transform: translateX(-10%) scale(1.1); }
}

/* HEADER CONTENT */
.header-inner {
    position: relative;
    z-index: 3;
    margin-top: 40px;
}

.header-logo {
    width: 150px;
    margin-bottom: 10px;
}

.header h1 {
    color: #F1F1F1;
    font-weight: 500;
    letter-spacing: 2px;
    font-size: 18px;
}

/* =========================
   SECTION
========================= */
.section {
    padding: 60px 20px;
}

.container {
    max-width: 1100px;
    margin: 0 auto;
}

/* =========================
   TEXTURED BOOK SECTION
========================= */
.section.texture {
    position: relative;
    background: #E8E6E1;
    color: #1c1c1c;
    overflow: hidden;
}

/* texture layer */
.section.texture::before {
    content: "";
    position: absolute;
    inset: 0;
    background: url('stone.png');
    background-size: cover;
    opacity: 0.16;
}

/* soft vignette */
.section.texture::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at center, transparent 40%, rgba(0,0,0,0.06) 100%);
}

/* =========================
   GRID
========================= */
.grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 60px;
    justify-items: center;
    margin-top: 50px;
}

/* =========================
   BOOK CARD
========================= */
.book {
    position: relative;
    z-index: 1;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
}

/* 🔥 GLOW LAYER */
.book::before {
    content: "";
    position: absolute;
    bottom: -10px;
    width: 120px;
    height: 30px;
    background: radial-gradient(rgba(0,0,0,0.25), transparent);
    filter: blur(10px);
    opacity: 0;
    transition: 0.4s;
}

/* IMAGE */
.book img {
    width: 200px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.25);
    transition: all 0.4s ease;
}

/* HOVER EFFECT */
.book:hover img {
    transform: translateY(-10px) scale(1.05);
    box-shadow: 0 40px 90px rgba(0,0,0,0.35);
}

/* 🔥 GLOW ACTIVATES */
.book:hover::before {
    opacity: 1;
    transform: scale(1.2);
}

/* TEXT */
.book p {
    margin-top: 14px;
    font-size: 15px;
    text-align: center;
    color: #1c1c1c;
    max-width: 220px;
}

/* =========================
   ANIMATION
========================= */
.reveal {
    opacity: 0;
    transform: translateY(30px);
    transition: all 1s ease;
}

.reveal.visible {
    opacity: 1;
    transform: translateY(0);
}

/* MOBILE */
@media (max-width: 900px) {
    .grid {
        grid-template-columns: 1fr;
    }
}

</style>
</head>

<body>

<!-- HEADER -->
<div class="header">

    <!-- NAV -->
    <div class="nav">
        <div class="nav-inner">
            <a href="index.html">Home</a>
            <a href="publications.html">Publications</a>
            <a href="about.html">About</a>
            <a href="author.html">Author</a>
            <a href="contact.html">Contact</a>
        </div>
    </div>

    <div class="header-overlay"></div>
    <div class="header-fog"></div>

    <div class="header-inner">
        <img src="logo (1).png" class="header-logo">
        <h1>Literary and psychological fiction shaped by place, memory, and unease.</h1>
    </div>

</div>

<!-- BOOKS -->
<div class="section texture reveal">
<div class="container">

<h2 style="text-align:center;">Current Publications</h2>

<div class="grid">

<a href="https://mybook.to/DourHillHouse" class="book reveal">
<img src="book1.jpg">
<p>Dour Hill House</p>
</a>

<a href="https://mybook.to/Corrour" class="book reveal">
<img src="book2.jpg">
<p>Corrour</p>
</a>

<a href="https://mybook.to/BlackBothy" class="book reveal">
<img src="book3.jpg">
<p>The Black Bothy</p>
</a>

</div>

</div>
</div>

<script>
const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
        if (entry.isIntersecting) {
            entry.target.classList.add('visible');
        }
    });
});
document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
</script>

</body>
</html>
