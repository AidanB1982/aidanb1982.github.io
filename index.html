<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blackwood Publishing</title>

<style>

/* ================= BASE ================= */
body {
    margin: 0;
    font-family: Georgia, serif;
    background: #0e0e10;
    color: #e6e6e6;
}

/* ================= HERO ================= */
.hero {
    height: 60vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    background:
        linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.9)),
        url('forest.png') center/cover;
}

.hero h1 {
    font-size: 42px;
    letter-spacing: 2px;
}

/* ================= FEATURED ================= */
.featured {
    padding: 100px 20px;
    text-align: center;
}

.featured img {
    width: 340px;
    filter: drop-shadow(0 50px 120px rgba(0,0,0,0.9));
    transition: transform 0.4s ease;
}

.featured img:hover {
    transform: rotateY(-8deg) rotateX(3deg) scale(1.05);
}

.featured h2 {
    margin-top: 25px;
    font-size: 28px;
}

/* ================= BOOK STRIP ================= */
.books {
    padding: 80px 0;
    overflow-x: auto;
}

.book-row {
    display: flex;
    gap: 40px;
    padding: 0 40px;
}

.book {
    flex: 0 0 auto;
    perspective: 800px;
}

.book img {
    width: 140px;
    filter: drop-shadow(0 25px 60px rgba(0,0,0,0.8));
    transition: transform 0.4s ease;
}

.book img:hover {
    transform: rotateY(-10deg) scale(1.08);
}

/* hide scrollbar (clean look) */
.books::-webkit-scrollbar {
    display: none;
}

/* ================= ABOUT ================= */
.about {
    padding: 80px 20px;
    text-align: center;
    max-width: 600px;
    margin: auto;
    line-height: 1.7;
}

/* ================= FOOTER ================= */
.footer {
    padding: 60px 20px;
    background: #000;
    text-align: center;
}

.socials img {
    width: 18px;
    margin: 10px;
    opacity: 0.7;
}

/* ================= MOBILE ================= */
@media (max-width: 700px) {
    .featured img { width: 240px; }
    .book img { width: 110px; }
}

</style>
</head>

<body>

<!-- HERO -->
<div class="hero">
<div>
<h1>BLACKWOOD</h1>
<p>Literary and psychological fiction shaped by place, memory, and unease.</p>
</div>
</div>

<!-- FEATURED BOOK -->
<div class="featured">

<img src="A1.png">

<h2>Dour Hill House</h2>
<p>A place that remembers.</p>

</div>

<!-- BOOK STRIP -->
<div class="books">

<div class="book-row">

<div class="book"><img src="A2.png"></div>
<div class="book"><img src="A3.png"></div>
<div class="book"><img src="A4.png"></div>
<div class="book"><img src="A5.png"></div>
<div class="book"><img src="A6.png"></div>
<div class="book"><img src="A7.png"></div>
<div class="book"><img src="A8.png"></div>
<div class="book"><img src="A9.png"></div>
<div class="book"><img src="A10.png"></div>
<div class="book"><img src="A11.png"></div>
<div class="book"><img src="A12.png"></div>

</div>

</div>

<!-- ABOUT -->
<div class="about">
<p>
Blackwood Publishing explores atmosphere, landscape, and the quiet persistence of what remains.
</p>
</div>

<!-- FOOTER -->
<div class="footer">

<p>Blackwood Publishing</p>

<div class="socials">
<a href="https://www.instagram.com/aidan.blackwood" target="_blank">
<img src="instagram.png">
</a>
<a href="https://www.tiktok.com/@aidanblackwood" target="_blank">
<img src="tiktok.png">
</a>
</div>

</div>

</body>
</html>
