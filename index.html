<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

/* =========================
   BASE
========================= */
body {
    margin: 0;
    background: #0f0f11;
    font-family: Georgia, serif;
    color: #e6e6e6;
}

/* =========================
   HERO
========================= */
.hero {
    position: relative;
    height: 100vh;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
}

/* BACKGROUND */
.hero::before {
    content: "";
    position: absolute;
    inset: 0;

    background:
        linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.75)),
        url('forest.png') center/cover no-repeat;

    animation: dayNightCycle 40s ease-in-out infinite alternate;
}

/* VIGNETTE */
.hero::after {
    content: "";
    position: absolute;
    inset: 0;

    background: radial-gradient(circle, transparent 40%, rgba(0,0,0,0.7)),
                linear-gradient(
                    to bottom,
                    rgba(20,30,60,0.2),   /* cold blue night */
                    rgba(0,0,0,0.4)
                );

    mix-blend-mode: multiply;

    animation: colorShift 40s ease-in-out infinite alternate;
}

/* =========================
   FOG (MULTI DEPTH)
========================= */
.fog-back,
.fog-mid,
.fog-front {
    position: absolute;
    inset: 0;
    background: url('fog.png');
    background-repeat: repeat-x;
    background-size: cover;

    mask-image: linear-gradient(to right, transparent, black 20%, black 80%, transparent);
    pointer-events: none;
}

/* DEPTH */
.fog-back { opacity: 0.05; animation: fogSlow 180s linear infinite; }
.fog-mid  { opacity: 0.08; animation: fogMid 120s linear infinite; }
.fog-front{ opacity: 0.12; animation: fogFast 60s linear infinite; }

/* =========================
   MOVING SHADOW (👁 PRESENCE)
========================= */
.shadow-entity {
    position: absolute;
    width: 300px;
    height: 300px;
    background: radial-gradient(circle, rgba(0,0,0,0.6), transparent 70%);
    filter: blur(40px);
    opacity: 0.4;
    animation: entityMove 18s ease-in-out infinite;
    pointer-events: none;
}

/* =========================
   TREE SHIFT (🌲 FAKE LIFE)
========================= */
.hero::before {
    animation: treeShift 20s ease-in-out infinite alternate;
}

/* =========================
   CONTENT
========================= */
.hero-inner {
    position: relative;
    z-index: 10;
    max-width: 600px;
    animation: fadeIn 2s ease forwards;
}

.hero-logo {
    width: 320px;
    max-width: 80%;
    margin-bottom: 20px;
    animation: logoFlicker 6s infinite;
}

.hero p {
    opacity: 0.85;
    line-height: 1.7;
    letter-spacing: 0.5px;
    text-shadow: 0 0 8px rgba(255,255,255,0.08);
}

/* NAV INLINE */
.nav-inline {
    margin: 20px 0;
}

.nav-inline a {
    margin: 0 15px;
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #e6e6e6;
    text-decoration: none;
    opacity: 0.7;
    transition: 0.3s;
}

.nav-inline a:hover {
    opacity: 1;
    text-shadow: 0 0 6px rgba(255,255,255,0.4);
}

/* BUTTON */
.button {
    display: inline-block;
    margin-top: 25px;
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    border-bottom: 1px solid rgba(255,255,255,0.4);
    padding-bottom: 4px;
    color: #e6e6e6;
    text-decoration: none;
}

/* =========================
   ANIMATIONS
========================= */

@keyframes fogSlow {
    from { transform: translateX(0); }
    to { transform: translateX(-600px); }
}

@keyframes fogMid {
    from { transform: translateX(0); }
    to { transform: translateX(-800px); }
}

@keyframes fogFast {
    from { transform: translateX(0); }
    to { transform: translateX(-1200px); }
}

/* ENTITY MOVEMENT */
@keyframes entityMove {
    0%   { transform: translate(10%, 40%); opacity: 0.2; }
    50%  { transform: translate(70%, 50%); opacity: 0.5; }
    100% { transform: translate(20%, 60%); opacity: 0.2; }
}

/* TREE SHIFT */
@keyframes treeShift {
    0%   { transform: scale(1) translateX(0); }
    100% { transform: scale(1.02) translateX(-10px); }
}

/* LOGO FLICKER */
@keyframes logoFlicker {
    0%,100%{opacity:1;}
    50%{opacity:0.85;}
}

/* FADE */
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px);}
    to { opacity: 1; transform: translateY(0);}
}
@keyframes dayNightCycle {

    /* 🌙 NIGHT (start) */
    0% {
        filter:
            grayscale(40%)
            brightness(0.65)
            contrast(120%)
            saturate(80%);
    }

    /* 🌒 EARLY LIGHT */
    25% {
        filter:
            grayscale(25%)
            brightness(0.8)
            contrast(110%)
            saturate(90%);
    }

    /* 🌫 MID (neutral eerie) */
    50% {
        filter:
            grayscale(15%)
            brightness(0.95)
            contrast(100%)
            saturate(100%);
    }

    /* 🌤 DAY (washed, still bleak) */
    75% {
        filter:
            grayscale(10%)
            brightness(1.1)
            contrast(95%)
            saturate(110%);
    }

    /* 🌙 BACK TO DARK */
    100% {
        filter:
            grayscale(40%)
            brightness(0.65)
            contrast(120%)
            saturate(80%);
    }
   @keyframes colorShift {
    0% {
        opacity: 0.6;
        background-color: rgba(10,20,40,0.3); /* cold blue */
    }

    50% {
        opacity: 0.3;
        background-color: rgba(80,60,40,0.15); /* warm dusk */
    }

    100% {
        opacity: 0.6;
        background-color: rgba(10,20,40,0.3);
    }
}
}
</style>
</head>

<body>

<section class="hero">

    <!-- FOG DEPTH -->
    <div class="fog-back"></div>
    <div class="fog-mid"></div>
    <div class="fog-front"></div>

    <!-- ENTITY -->
    <div class="shadow-entity"></div>

    <!-- CONTENT -->
    <div class="hero-inner">

        <img src="logo.png" class="hero-logo">

        <div class="nav-inline">
            <a href="#">Home</a>
            <a href="#">Publications</a>
            <a href="#">About</a>
            <a href="#">Author</a>
            <a href="#">Contact</a>
        </div>

        <p>
        Independent publisher of literary and psychological fiction shaped by place,
        memory, and unease.
        </p>

        <a href="#" class="button">Explore Publications</a>

    </div>

</section>

<script>

/* PARALLAX + LIGHT */
const hero = document.querySelector('.hero');

let targetX = 50, targetY = 50;
let currentX = 50, currentY = 50;

hero.addEventListener('mousemove', e => {
    const rect = hero.getBoundingClientRect();
    targetX = ((e.clientX - rect.left) / rect.width) * 100;
    targetY = ((e.clientY - rect.top) / rect.height) * 100;
});

function animate() {
    currentX += (targetX - currentX) * 0.05;
    currentY += (targetY - currentY) * 0.05;

    hero.style.setProperty('--mx', currentX + '%');
    hero.style.setProperty('--my', currentY + '%');

    requestAnimationFrame(animate);
}
animate();

</script>

</body>
</html>
