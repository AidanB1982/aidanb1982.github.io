<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blackwood Publishing</title>

<style>

/* =========================
   BASE
========================= */
body {
    margin: 0;
    font-family: Georgia, serif;
    background: #0f0f11;
    color: #e6e6e6;
    overflow: hidden;
}

/* =========================
   HERO
========================= */
.hero {
    position: relative;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    overflow: hidden;
}

/* BACKGROUND + ZOOM */
.hero::before {
    content: "";
    position: absolute;
    inset: 0;

    background:
        linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.8)),
        url('forest.png') center/cover no-repeat;

    animation: zoomIn 20s ease-out forwards;

    z-index: 0;
}

/* FOG (FIXED SEAM + FADE EDGES) */
.hero::after {
    content: "";
    position: absolute;
    inset: -200px;

    background:
        radial-gradient(circle at center, rgba(0,0,0,0) 60%, rgba(0,0,0,0.8) 100%),
        url('fog.png') repeat;

    opacity: 0.18;

    animation: fogDrift 90s linear infinite;

    mask-image: radial-gradient(circle, black 60%, transparent 100%);
    -webkit-mask-image: radial-gradient(circle, black 60%, transparent 100%);

    mix-blend-mode: screen;
    pointer-events: none;
    z-index: 1;
}

/* LIGHT RAYS */
.light-rays {
    position: absolute;
    inset: 0;

    background:
        radial-gradient(circle at var(--mx,50%) var(--my,50%), rgba(255,255,255,0.15), transparent 50%),
        linear-gradient(120deg, rgba(255,255,255,0.05) 0%, transparent 40%);

    mix-blend-mode: screen;
    opacity: 0.25;
    pointer-events: none;
    z-index: 2;
}

/* GRAIN OVERLAY */
.grain {
    position: absolute;
    inset: 0;
    background: url('https://grainy-gradients.vercel.app/noise.svg');
    opacity: 0.08;
    pointer-events: none;
    z-index: 3;
}

/* CONTENT */
.hero-inner {
    position: relative;
    z-index: 4;
    max-width: 600px;

    animation: fadeInUp 2s ease forwards;
}

/* LOGO */
.hero-logo {
    width: 320px;
    max-width: 80%;
    opacity: 0;
    animation: fadeIn 2s ease forwards;
}

/* NAV */
.nav-inline {
    margin: 20px 0;
    opacity: 0;
    animation: fadeIn 2s ease forwards;
    animation-delay: 1s;
}

.nav-inline a {
    margin: 0 12px;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    opacity: 0.7;
    transition: 0.3s;
}

.nav-inline a:hover {
    opacity: 1;
}

/* TEXT */
.hero p {
    opacity: 0;
    animation: fadeIn 2s ease forwards;
    animation-delay: 1.5s;
}

/* BUTTON */
.button {
    display: inline-block;
    margin-top: 20px;
    font-size: 12px;
    letter-spacing: 2px;
    border-bottom: 1px solid rgba(255,255,255,0.4);
    padding-bottom: 4px;
    opacity: 0;
    animation: fadeIn 2s ease forwards;
    animation-delay: 2s;
}

/* =========================
   ANIMATIONS
========================= */

@keyframes fogDrift {
    from { transform: translateX(0); }
    to { transform: translateX(-1000px); }
}

@keyframes zoomIn {
    from { transform: scale(1.1); }
    to { transform: scale(1); }
}

@keyframes fadeIn {
    to { opacity: 1; }
}

@keyframes fadeInUp {
    from {
        opacity: 0;
        transform: translateY(40px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

</style>
</head>

<body>

<section class="hero">

    <div class="light-rays"></div>
    <div class="grain"></div>

    <div class="hero-inner">

        <img src="logo (1).png" class="hero-logo">

        <div class="nav-inline">
            <a href="#">Home</a>
            <a href="#">Publications</a>
            <a href="#">About</a>
            <a href="#">Author</a>
            <a href="#">Contact</a>
        </div>

        <p>
        Independent publisher of literary and psychological fiction shaped by place, memory, and unease.
        </p>

        <a href="#" class="button">Explore Publications</a>

    </div>

</section>

<script>

/* LIGHT FOLLOW */
const hero = document.querySelector('.hero');

let targetX = 50, targetY = 50;
let currentX = 50, currentY = 50;

hero.addEventListener('mousemove', e => {
    const rect = hero.getBoundingClientRect();

    targetX = ((e.clientX - rect.left) / rect.width) * 100;
    targetY = ((e.clientY - rect.top) / rect.height) * 100;
});

function animateLight() {
    currentX += (targetX - currentX) * 0.05;
    currentY += (targetY - currentY) * 0.05;

    hero.style.setProperty('--mx', currentX + '%');
    hero.style.setProperty('--my', currentY + '%');

    requestAnimationFrame(animateLight);
}
animateLight();

</script>

</body>
</html>
