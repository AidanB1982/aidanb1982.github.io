<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blackwood Publishing</title>

<link rel="stylesheet" href="css/header.css">
<link rel="stylesheet" href="css/styles.css">

</head>

<body>

<!-- HEADER -->
<div id="header-placeholder"></div>

<!-- FEATURED SECTION -->
<section class="featured">
    <div class="featured-inner">

        <div class="featured-image fade-in" data-speed="0.3">
            <img src="/assets/A1.png" alt="Corrour Bothy">
        </div>

        <div class="featured-content fade-in" data-speed="0.6">
            <div class="featured-label">Featured Work</div>

            <h2>Corrour Bothy: The First Summoning</h2>

            <p>
                A remote Highland bothy draws in those already carrying quiet fractures.
                What begins as refuge shifts into something less certain, as the surrounding
                landscape unsettles perception and an unseen presence begins to exert influence.
            </p>

            <a href="https://pay.tide.co/products/corrour-bot-5KdqBmDa/landing" class="button" target="_blank">
                View Details
            </a>
        </div>

    </div>
</section>

<!-- HEADER SCRIPT -->
<script src="js/header.js"></script>

<!-- SCROLL REVEAL + PARALLAX -->
<script>
document.addEventListener("DOMContentLoaded", () => {

    const elements = document.querySelectorAll('.fade-in');

    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                entry.target.classList.add('visible');
            }
        });
    }, { threshold: 0.25 });

    elements.forEach(el => observer.observe(el));

});

window.addEventListener('scroll', () => {

    const elements = document.querySelectorAll('[data-speed]');
    const scrollY = window.scrollY;

    elements.forEach(el => {
        const speed = parseFloat(el.getAttribute('data-speed'));
        const offset = scrollY * speed * -0.1;

        if (el.classList.contains('visible')) {
            el.style.transform = `translateY(${offset}px)`;
        }
    });

});
</script>

</body>
</html>
