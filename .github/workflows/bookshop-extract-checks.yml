name: Verify bookshop extraction pipeline

on:
  pull_request:
    paths:
      - "scripts/geofabrik-bookshops-core.mjs"
      - "scripts/build-geofabrik-bookshops.mjs"
      - "scripts/refresh-geofabrik-bookshops.sh"
      - "scripts/test-geofabrik-bookshops.mjs"
      - "scripts/build-public-bookshops.mjs"
      - "js/bookshop-cluster-grid.js"
      - "js/public-bookshops.js"
      - "css/public-bookshops.css"
      - "pages/find-bookshops.html"
      - "scripts/test-bookshop-clusters.mjs"
      - "js/bookshop-verification-core.js"
      - "js/bookshop-verification-desk.js"
      - "js/bookshop-outreach.js"
      - "js/bookshop-outreach-access.js"
      - "css/bookshop-outreach.css"
      - "pages/bookshop-outreach.html"
      - "scripts/test-bookshop-verification.mjs"
      - "scripts/test-bookshop-contact-review.mjs"
      - "js/bookshop-contact-review-core.js"
      - "js/bookshop-contact-review-desk.js"
      - ".github/workflows/bookshop-discovery.yml"
      - ".github/workflows/bookshop-extract-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install OSM extraction tool
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends osmium-tool
      - name: Syntax validation
        run: |
          node --check scripts/geofabrik-bookshops-core.mjs
          node --check scripts/build-geofabrik-bookshops.mjs
          node --check scripts/build-public-bookshops.mjs
          bash -n scripts/refresh-geofabrik-bookshops.sh
      - name: Validate extraction, clustering and data safety on local fixtures
        run: |
          node --check js/public-bookshops.js
          node --check js/bookshop-cluster-grid.js
          node --check js/bookshop-outreach.js
          node --check js/bookshop-verification-core.js
          node --check js/bookshop-verification-desk.js
          node --check js/bookshop-contact-review-core.js
          node --check js/bookshop-contact-review-desk.js
          node --test scripts/test-bookshop-contact-review.mjs scripts/test-bookshop-verification.mjs scripts/test-bookshop-clusters.mjs scripts/test-geofabrik-bookshops.mjs scripts/test-bookshop-pipeline.mjs
