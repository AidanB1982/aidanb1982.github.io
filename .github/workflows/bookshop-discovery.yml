
name: Refresh Scottish bookshops and public directory

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/bookshop-discovery.yml"
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 0"

permissions:
  contents: write

concurrency:
  group: bookshop-discovery
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate discovery scripts
        run: |
          node --check scripts/update-bookshops.mjs
          node --check scripts/build-public-bookshops.mjs

      - name: Test public directory privacy and refresh safeguards
        run: node --test scripts/test-bookshop-pipeline.mjs

      - name: Fetch OpenStreetMap bookshops
        run: node scripts/update-bookshops.mjs

      - name: Rebuild privacy-safe public bookshop feed
        run: node scripts/build-public-bookshops.mjs

      - name: Commit updated data
        run: |
          if git diff --quiet -- data/scotland-bookshops.json data/public-bookshops.json; then
            echo "No changes to bookshop data."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/scotland-bookshops.json data/public-bookshops.json
          git commit -m "Refresh Scottish bookshops and public finder"
          git push
